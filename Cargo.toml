[workspace]
resolver = "3"
members = [
    "crates/pitboard-core",
    "crates/pitboard",
    "crates/pitboard-ffi",
    "crates/uniffi-bindgen-swift",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/datlechin/pitboard"
homepage = "https://usepitboard.com"

[workspace.dependencies]
pitboard-core = { path = "crates/pitboard-core", version = "=0.1.4" }
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
hex = "0.4"
insta = { version = "1.48", features = ["json", "redactions"] }
jiff = "0.2"
libc = "0.2"
machine-uid = "0.6"
mockito = "1.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
# The generator must be this exact version too: bindings check method checksums at load time.
uniffi = "=0.32.1"
# TLS: rustls for the protocol, the operating system for deciding which certificates to
# trust. No bundled root store, so a corporate or system trust setting is honoured.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
