[workspace]
resolver = "3"
members = [
    "crates/pitboard-core",
    "crates/pitboard",
    "crates/pitboard-ffi",
    "crates/pitboard-sites",
    "crates/pitboard-share-ffi",
    "crates/uniffi-bindgen-swift",
    "crates/uniffi-bindgen-csharp",
    "crates/pitboard-conformance",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/datlechin/pitboard"
homepage = "https://usepitboard.com"

[workspace.dependencies]
pitboard-core = { path = "crates/pitboard-core", version = "=0.7.0" }
pitboard-sites = { path = "crates/pitboard-sites" }
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
roff = "1"
hex = "0.4"
insta = { version = "1.48", features = ["json", "redactions"] }
jiff = "0.2"
libc = "0.2"
machine-uid = "0.6"
mockito = "1.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# For the account windows' store ids alone, which are version 5 UUIDs, and RFC 9562 defines
# those over SHA-1. Nothing secret is hashed.
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
# Columns are counted in what a terminal shows, not in characters: a CJK label is two
# columns wide per character and would push everything after it out of line.
unicode-width = "0.2"
# The generator must be this exact version too: bindings check method checksums at load time.
uniffi = "=0.31.2"
# TLS: rustls for the protocol, the operating system for deciding which certificates to
# trust. No bundled root store, so a corporate or system trust setting is honoured.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# IDNA, for a host that is not plain ASCII. pitboard-sites splits a link itself, as
# Foundation does, since the WHATWG standard url follows reads some links otherwise.
url = "2.5"
# Claude Desktop's cookies, decrypted only for live usage a person turned on. ring is
# already here for TLS and gives PBKDF2; AES-128 itself is the RustCrypto block cipher,
# with CBC written out beside it. zeroize wipes the key and the session once read.
ring = { version = "0.17", default-features = false }
aes = { version = "0.8", features = ["zeroize"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
