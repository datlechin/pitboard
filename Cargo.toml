[workspace]
resolver = "3"
members = [
    "crates/pitboard-core",
    "crates/pitboard",
    "crates/pitboard-model",
    "crates/pitboard-ffi",
    "crates/pitboard-sites",
    "crates/pitboard-share-ffi",
    "crates/uniffi-bindgen-swift",
    "crates/uniffi-bindgen-csharp",
    "crates/pitboard-conformance",
    "crates/pitboard-probe",
    "apps/linux",
]
# Every member but the Linux app, whose GTK and libadwaita development files are on no machine
# but the Linux app's own: `cargo build`, `clippy` and `nextest` leave it out unless asked
# with `-p pitboard-linux` or `--workspace`, where it compiles as nothing off Linux.
default-members = [
    "crates/pitboard-core",
    "crates/pitboard",
    "crates/pitboard-model",
    "crates/pitboard-ffi",
    "crates/pitboard-sites",
    "crates/pitboard-share-ffi",
    "crates/uniffi-bindgen-swift",
    "crates/uniffi-bindgen-csharp",
    "crates/pitboard-conformance",
    "crates/pitboard-probe",
]

[workspace.package]
version = "1.0.0-beta.7"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/datlechin/pitboard"
homepage = "https://usepitboard.com"

[workspace.dependencies]
pitboard-core = { path = "crates/pitboard-core", version = "=0.18.0" }
pitboard-sites = { path = "crates/pitboard-sites" }
pitboard-model = { path = "crates/pitboard-model" }
anstream = "1"
anstyle = "1"
# Already in every build through ureq, and what Codex decodes its managed preferences with.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
roff = "1"
hex = "0.4"
insta = { version = "1.48", features = ["json", "redactions"] }
jiff = "0.2"
libc = "0.2"
machine-uid = "0.6"
# The system's own notice of a write to Pitboard's directory: inotify, FSEvents and
# ReadDirectoryChangesW behind one API, where each front end otherwise looked every 2 seconds.
notify = "8.2"
mockito = "1.7.2"
serde = { version = "1", features = ["derive"] }
# raw_value: a settings file's untouched values are written back byte for byte.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# Claude's cookie jar is SQLite: the system's, never a bundled build. 0.40 needs a Rust past 1.91.
rusqlite = { version = "0.40.2", default-features = false }
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2"
# Codex's configuration, read as Codex 0.160.0 reads it. The parser alone: Pitboard never
# writes TOML, so neither the writer nor the order a table was written in is wanted.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
# macOS's forced managed preferences, which Codex reads the same way, through the bindings
# Codex itself uses.
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
unicode-normalization = "0.1"
# Characters as a person counts them, as Swift counts a String's, for the menu bar's cut of a
# long label.
unicode-segmentation = "1.13"
# Columns are counted in what a terminal shows, not in characters: a CJK label is two
# columns wide per character and would push everything after it out of line.
unicode-width = "0.2"
windows-registry = "0.6"
windows-sys = "0.61"
# Both generators must match this exact version, since bindings check method checksums at load
# time. The Swift one is built from it. The C# one, uniffi-bindgen-cs, is released for one
# UniFFI version at a time (v0.11.1+v0.31.0 reads 0.31), so this moves only with a release of
# it for the new version; Dependabot leaves it alone. Default features off: the libraries read
# no Cargo metadata, and the Swift generator asks for it itself.
uniffi = { version = "=0.31.2", default-features = false }
# TLS: rustls for the protocol, the operating system for deciding which certificates to
# trust. No bundled root store, so a corporate or system trust setting is honoured.
# No socks-proxy: its connector in 3.4.2 waits past the time limit and looks the proxy up
# before NO_PROXY, so Pitboard refuses SOCKS proxies (pitboard-core's proxy::Refusal).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# IDNA, for a host that is not plain ASCII. pitboard-sites splits a link itself, as
# Foundation does, since the WHATWG standard url follows reads some links otherwise.
url = "2.5"
# The account windows' store ids, version 5 UUIDs. Nothing secret is hashed.
uuid = { version = "1.27", default-features = false, features = ["v5"] }
# D-Bus on Linux: the user's systemd, which its private socket serves peer to peer. 5, since
# 6.0.0 removed the blocking API (its CHANGELOG) and the Linux crates Pitboard takes, such as
# secret-service 5.2, are on 5. async-io runs zbus's own executor, so no tokio.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api", "p2p"] }
# The Secret Service, where Linux parks a login: blocking over the zbus above, a DH session in
# pure Rust, so the static musl command line links it. Not oo7, which needs Rust 1.92 and an
# executor, nor keyring, whose docs tell a program that chooses its store not to link it.
secret-service = { version = "5.2", default-features = false, features = ["rt-async-io-crypto-rust"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
# `--cfg pitboard_unreleased_windows`, set in RUSTFLAGS, opens a Windows build before Windows
# is released: CI's Windows jobs and a person working on Pitboard there set it. Never a
# feature, which crates.io would offer to anybody (pitboard-core's release.rs says why).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pitboard_unreleased_windows)"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
