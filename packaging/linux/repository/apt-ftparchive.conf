// apt-ftparchive's configuration for linux-repository.sh, which runs `generate` and `release` with
// it from the folder it builds the repository in: the apt tree in deb, apt-ftparchive's cache
// beside it, never in what is served. A suite's Packages and Contents list the pool's packages of
// each architecture and of all, and its Release names every index by its SHA-256 alone, with a
// copy under by-hash, and no Valid-Until: releases come weeks apart.
Dir {
  ArchiveDir "deb";
  CacheDir "cache";
};

Default {
  Packages::Compress ". gzip xz";
  Contents::Compress "gzip";
};

TreeDefault {
  Directory "pool/$(SECTION)";
  Contents "$(DIST)/$(SECTION)/Contents-$(ARCH)";
};

Tree "dists/stable" {
  Sections "main";
  Architectures "amd64 arm64";
};

Tree "dists/beta" {
  Sections "main";
  Architectures "amd64 arm64";
};

APT::FTPArchive::DoByHash "true";

APT::FTPArchive::Release {
  Origin "Pitboard";
  Label "Pitboard";
  Architectures "amd64 arm64";
  Components "main";
  MD5 "false";
  SHA1 "false";
  SHA512 "false";
};
