[package]
name = "pitboard"
description = "Switch Claude Code, Codex and Claude Desktop between your own accounts without signing out, and see what each Claude Code and Codex account has left."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["claude-code", "codex", "windows", "macos", "linux"]
categories = ["command-line-utilities"]

# cargo-binstall fetches the release the workflow already builds instead of compiling the
# tree, which is minutes of work for someone who only wants the binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
# quick-install serves a third party's build, which a tool holding OAuth logins should not
# install, and reports every install to a stats server.
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
pitboard-core.workspace = true
anstream.workspace = true
anstyle.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
roff.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[dev-dependencies]
pitboard-core = { workspace = true, features = ["test-support"] }
insta.workspace = true
mockito.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
