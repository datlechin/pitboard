[package]
name = "pitboard-core"
description = "The engine behind Pitboard: parking and restoring Claude Code and Codex logins. Serves Pitboard's own front ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["claude", "keychain", "credentials"]
categories = ["authentication"]

[features]
# Internals the integration tests reach into. Not part of the library's API.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
sha2.workspace = true
hex.workspace = true
unicode-normalization.workspace = true
machine-uid.workspace = true
ureq.workspace = true
rustls.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-foundation-sys.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
