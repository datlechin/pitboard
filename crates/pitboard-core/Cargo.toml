[package]
name = "pitboard-core"
description = "The engine behind Pitboard: switches Claude Code, Codex and Claude Desktop between accounts by parking and restoring their logins. Its API serves Pitboard's own front ends."
# Its own line, apart from Pitboard's: it follows the core's API.
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["claude-code", "codex", "keychain", "credentials", "oauth"]
categories = ["authentication"]

[features]
# Internals the integration tests reach into. Not part of the library's API.
test-support = []

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
sha2.workspace = true
hex.workspace = true
unicode-normalization.workspace = true
machine-uid.workspace = true
notify.workspace = true
ureq.workspace = true
rustls.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
secret-service.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
core-foundation-sys.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_GroupPolicy",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
# Task Scheduler's ITaskService is COM, which windows-sys does not wrap. The daily renewal's
# task alone.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
