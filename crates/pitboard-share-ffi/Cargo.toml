[package]
name = "pitboard-share-ffi"
description = "The check a Share extension makes of a link and what it says, as generated bindings, with nothing of Pitboard's core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# A static library for the macOS Share extension, a dynamic one for PitboardShare.exe on
# Windows. Each carries its own Rust standard library, so it never shares a binary with
# pitboard-ffi.
crate-type = ["lib", "staticlib", "cdylib"]

# pitboard-sites and UniFFI, and nothing of the core: the extension is sandboxed, and links
# nothing it does not use.
[dependencies]
pitboard-sites.workspace = true
uniffi.workspace = true

[lints]
workspace = true
