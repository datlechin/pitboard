[package]
name = "pitboard-ffi"
description = "The libraries Pitboard's macOS and Windows apps link, holding pitboard-model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# A static library for the macOS app, a dynamic one for the Windows app to load.
crate-type = ["staticlib", "cdylib"]

[features]
fixture = ["pitboard-model/fixture"]

[dependencies]
pitboard-model.workspace = true

[lints]
workspace = true
