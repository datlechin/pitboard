name: Conformance

# Every load-bearing fact Pitboard has about a tool was read out of one build of it, and
# Claude Code and Codex each ship several times a week. This reads the newest build of each
# tool for each system against its register with pitboard-conformance, which says what such
# a reading proves. A build is read as bytes, on Linux, and never run.

on:
  schedule:
    # Twice a week, on days the Sparkle check does not run, so two failures do not arrive
    # together.
    - cron: "17 6 * * 2,5"
  workflow_dispatch:
    inputs:
      version:
        description: Which Claude Code to check, or blank for the newest
        required: false
      codex_version:
        description: Which Codex to check, or blank for the newest
        required: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.tool }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tool: [claude-code, codex]
        platform:
          - linux-x64
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
          - darwin-arm64
          - win32-x64
          - win32-arm64
        # Codex's Linux builds are musl already, and it publishes no package of either name.
        exclude:
          - tool: codex
            platform: linux-x64-musl
          - tool: codex
            platform: linux-arm64-musl
        include:
          - tool: claude-code
            package: "@anthropic-ai/claude-code"
            binary: claude
            provider: claude
            version: ${{ inputs.version }}
          - tool: codex
            package: "@openai/codex"
            binary: codex
            provider: codex
            version: ${{ inputs.codex_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust

      - name: Fetch the build to check
        id: fetch
        env:
          TOOL: ${{ matrix.tool }}
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ matrix.version }}
        run: |
          version=${VERSION:-$(npm view "$PACKAGE" version)}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Neither wrapper on npm carries a binary. Claude Code's native build is a package
          # of its own; Codex's is a tagged version of the wrapper, whose vendor/ holds it
          # beside Codex's other programs. The binary is found by its name: nothing says a
          # Windows build keeps an execute bit.
          case $TOOL in
            claude-code) spec="$PACKAGE-$PLATFORM@$version" ;;
            codex) spec="$PACKAGE@$version-$PLATFORM" ;;
          esac
          npm pack "$spec" --silent
          tar xzf ./*.tgz
          found=$(find package -type f \( -name "$BINARY" -o -name "$BINARY.exe" \) | head -1)
          test -n "$found" || { echo "no $BINARY in $spec"; exit 1; }
          echo "binary=$found" >> "$GITHUB_OUTPUT"

      - name: Read Pitboard's facts out of it
        env:
          BINARY: ${{ steps.fetch.outputs.binary }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          cargo run --locked --release -p pitboard-conformance -- \
            "$BINARY" --provider "$PROVIDER" | tee report.txt
          cargo run --locked --release -p pitboard-conformance -- \
            "$BINARY" --provider "$PROVIDER" --json > report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-${{ matrix.tool }}-${{ steps.fetch.outputs.version }}-${{ matrix.platform }}
          path: |
            report.txt
            report.json
