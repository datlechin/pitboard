name: Windows runner facts

# A measurement, not a check: what an image does can change with no commit, and no pull
# request can fix that. Run it by hand on a branch when a fact is wanted, such as after a
# Windows image changes or a pull request changes the probe or runner-facts.ps1. With session
# set, it builds the session bundle instead, which only the owner dispatches.

on:
  workflow_dispatch:
    inputs:
      bun-version:
        description: The Bun the helpers run under, the one the newest Claude Code embeds.
        default: 1.4.3
      bun-sha256-x64:
        description: bun-windows-x64.zip's SHA-256, for a Bun other than the pinned one.
        default: ""
      bun-sha256-aarch64:
        description: bun-windows-aarch64.zip's SHA-256, for a Bun other than the pinned one.
        default: ""
      session:
        description: Build the session bundle for the session machine instead of measuring.
        type: boolean
        default: false
      age-recipient:
        description: The owner's age public key, which the session bundle is encrypted to.
        default: ""

permissions:
  contents: read

jobs:
  facts:
    if: ${{ !inputs.session }}
    name: facts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SHA-256 of the pinned Bun's zip for each, read from that release's
          # SHASUMS256.txt and checked against the zip itself on 2026-10-15.
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            bun-pinned: 1.4.3
            bun-zip: bun-windows-x64.zip
            bun-sha256: 0bf84e808552beea67bf1202a287a35c6c825d837b287b3f8e9dd513dba35d3d
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            bun-pinned: 1.4.3
            bun-zip: bun-windows-aarch64.zip
            bun-sha256: 5e8f142ef722cbc9f67dc068a166e46ee72be8307b38cac7186589d2face668f
            # windows-11-arm ships no sshd, so RF-M installs Win32-OpenSSH from Microsoft's
            # release. The SHA-256 of OpenSSH-ARM64.zip, read from the release and checked
            # against the zip on 2026-10-15. windows-2025 ships sshd and installs none.
            openssh-tag: 10.0.0.0p2-Preview
            openssh-zip: OpenSSH-ARM64.zip
            openssh-sha256: 698c6aec31c1dd0fb996206e8741f4531a97355686b5431ef347d531b07fcd42
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Which Bun runs, and the SHA-256 its zip must have, before anything is built.
      - name: Bun's version and checksum
        id: bun
        env:
          VERSION: ${{ inputs.bun-version }}
          PINNED_VERSION: ${{ matrix.bun-pinned }}
          PINNED: ${{ matrix.bun-sha256 }}
          GIVEN_X64: ${{ inputs.bun-sha256-x64 }}
          GIVEN_AARCH64: ${{ inputs.bun-sha256-aarch64 }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bun-version must be three numbers, such as 1.4.3" >&2
            exit 1
          fi
          if [ "$VERSION" = "$PINNED_VERSION" ]; then
            sha="$PINNED"
          elif [ "$TRIPLE" = x86_64-pc-windows-msvc ]; then
            sha="$GIVEN_X64"
          else
            sha="$GIVEN_AARCH64"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Bun $VERSION is not the pinned one, so give its zip's SHA-256 for this system" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/rust
        with:
          cache: false
          targets: ${{ matrix.os == 'windows-11-arm' && 'x86_64-pc-windows-msvc' || '' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      # ring compiles its C with clang on ARM64 Windows, and nothing else.
      - if: runner.arch == 'ARM64'
        run: clang --version
      - name: This image
        shell: pwsh
        run: |
          cmd /c ver
          rustc -vV
          Get-Command clang, llvm-readobj -ErrorAction SilentlyContinue | Select-Object Name, Source
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property catalog_productDisplayVersion
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          }
          exit 0
      - uses: ./.github/actions/windows-builds
        with:
          triple: ${{ matrix.triple }}
      # An x64 probe for RF-H1, which windows-11-arm runs under emulation. A failed build only
      # leaves that one process out.
      - name: An x64 probe
        if: matrix.os == 'windows-11-arm'
        continue-on-error: true
        run: cargo build --locked -p pitboard-probe --target x86_64-pc-windows-msvc
      # For CF8's Pitboard.exe --unregister-share: the Release publish with PitboardShare.exe and
      # its package beside Pitboard.exe, as the MSI lays them out. The package's publisher is the
      # subject of CF8's throwaway certificate, which runner-facts.ps1 makes and signs it with. A
      # failed build only leaves that row out.
      - name: Pitboard.exe and PitboardShare.exe as a release publishes them
        id: app
        continue-on-error: true
        env:
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          WINDOWS_SIGNER_SUBJECT: CN=PitboardProbe
        run: |
          cargo build --locked -p pitboard-ffi -p pitboard-share-ffi
          mkdir -p apps/windows/Pitboard.Core/Generated apps/windows/Pitboard.Share.Core/Generated
          cargo run --locked -p uniffi-bindgen-csharp -- --library target/debug/pitboard_ffi.dll \
            --out-dir apps/windows/Pitboard.Core/Generated --config crates/pitboard-model/uniffi.toml --no-format
          cargo run --locked -p uniffi-bindgen-csharp -- --library target/debug/pitboard_share_ffi.dll \
            --out-dir apps/windows/Pitboard.Share.Core/Generated --config crates/pitboard-share-ffi/uniffi.toml --no-format
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          package=$(sh .github/scripts/windows-versions.sh "$version" | sed -n 's/^package=//p')
          out="$RUNNER_TEMP/pitboard-app"
          # From the folder of global.json, which names the SDK the lock files hold.
          cd apps/windows
          dotnet publish Pitboard.App -c Release -r "$RUNTIME" -p:Platform="$PLATFORM" -o "$out" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/debug/pitboard_ffi.dll"
          dotnet publish Pitboard.Share -c Release -r "$RUNTIME" -o "$out" \
            -p:PitboardShareNativeLibrary="$GITHUB_WORKSPACE/target/debug/pitboard_share_ffi.dll"
          pwsh -NoProfile -File ../../.github/scripts/pack-windows-share.ps1 -Folder "$out" \
            -Publisher "$WINDOWS_SIGNER_SUBJECT" -Version "$package"
      # The runner facts, as the job's user and as throwaway users the script makes on this
      # disposable runner. runner-facts.ps1 says what it changes, and undoes each change.
      - name: Runner facts
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          BUN_VERSION: ${{ steps.bun.outputs.version }}
          BUN_ZIP: ${{ matrix.bun-zip }}
          BUN_SHA256: ${{ steps.bun.outputs.sha256 }}
          OPENSSH_TAG: ${{ matrix.openssh-tag }}
          OPENSSH_ZIP: ${{ matrix.openssh-zip }}
          OPENSSH_SHA256: ${{ matrix.openssh-sha256 }}
          APP_BUILT: ${{ steps.app.outcome }}
        run: |
          $x64 = 'target/x86_64-pc-windows-msvc/debug/pitboard-probe.exe'
          ./.github/scripts/runner-facts.ps1 -Probe target/debug/pitboard-probe.exe `
            -ProbeX64 $(if ($env:TRIPLE -ne 'x86_64-pc-windows-msvc' -and (Test-Path $x64)) { (Resolve-Path $x64).Path } else { '' }) `
            -Triple $env:TRIPLE -Out (Join-Path $env:RUNNER_TEMP 'runner-facts.json') `
            -Helpers crates/pitboard-probe/helpers `
            -BunVersion $env:BUN_VERSION -BunZip $env:BUN_ZIP -BunSha256 $env:BUN_SHA256 `
            -OpenSshTag $env:OPENSSH_TAG -OpenSshZip $env:OPENSSH_ZIP -OpenSshSha256 $env:OPENSSH_SHA256 `
            -Pitboard target/gated/debug/pitboard.exe `
            -App $(if ($env:APP_BUILT -eq 'success') { Join-Path $env:RUNNER_TEMP 'pitboard-app' } else { '' })
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-facts-${{ matrix.triple }}
          path: ${{ runner.temp }}/runner-facts.json
          if-no-files-found: warn

  # The repository is public, so the bundle leaves the runner only encrypted to the owner's age key.
  session:
    if: inputs.session
    name: session (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # age 1.3.2's zip for each, and its SHA-256 as the release lists it, checked against the
          # zip itself on 2026-10-17.
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            installer: x64
            age-zip: age-v1.3.2-windows-amd64.zip
            age-sha256: f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            installer: arm64
            age-zip: age-v1.3.2-windows-arm64.zip
            age-sha256: fae351336c8d5f30f93cc3ccdec16d1ed7851d68cdd6656d41955cc31a447c9d
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # The static C runtime and no cfg: the release gate is what the version's major makes it.
      RUSTFLAGS: -C target-feature=+crt-static
      PITBOARD_REQUIRE_VERSIONINFO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # As CI's windows-app job builds with. No Windows feed exists before 1.0.0.
      UPDATE_TEST_KEY: q1exPQ+LBkab+sdFuHAN+8eRpiHNak3rq4kpW8aH2G4=
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The key comes from the event, not env:, whose values the log prints: a secret key pasted in
      # its place must never reach the log.
      - name: A branch at 1.0.0-beta.1 or later, no cfg, and the owner's age key
        id: gate
        env:
          REF: ${{ github.ref }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          key=$(pwsh -NoProfile -Command $'(Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json).inputs.\'age-recipient\'' | tr -d '\r')
          sh .github/scripts/session-gate.sh "$REF" "$version" "$key" >> "$GITHUB_OUTPUT"
      - name: age, from its release, checked against the SHA-256 pinned here
        id: age
        shell: pwsh
        env:
          AGE_ZIP: ${{ matrix.age-zip }}
          AGE_SHA256: ${{ matrix.age-sha256 }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP $env:AGE_ZIP
          Invoke-WebRequest -Uri "https://github.com/FiloSottile/age/releases/download/v1.3.2/$env:AGE_ZIP" -OutFile $zip `
            -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $env:AGE_SHA256) {
            throw "$env:AGE_ZIP is not the build whose SHA-256 the workflow pinned; nothing of it runs"
          }
          $folder = Join-Path $env:RUNNER_TEMP 'age'
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          "exe=$(Join-Path $folder 'age\age.exe')" >> $env:GITHUB_OUTPUT
      - uses: ./.github/actions/windows-release
        with:
          triple: ${{ matrix.triple }}
          version: ${{ steps.gate.outputs.version }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - uses: ./.github/actions/windows-app-libraries
        with:
          triple: ${{ matrix.triple }}
      - name: Pitboard.exe, published as a release with no signer publishes it
        working-directory: apps/windows
        env:
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.gate.outputs.version }}
          FILE_VERSION: ${{ steps.gate.outputs.file }}
        run: |
          out="$RUNNER_TEMP/app"
          dotnet publish Pitboard.App -c Release -r "$RUNTIME" -p:Platform="$PLATFORM" -o "$out" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" \
            -p:WINDOWS_UPDATE_PUBLIC_KEY="$UPDATE_TEST_KEY" -p:Version="$VERSION" -p:FileVersion="$FILE_VERSION"
          cmp "$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" "$out/pitboard_ffi.dll"
      # Each built, extracted with msiexec /a and checked as release.yml's app-windows-package does an
      # unsigned beta's. No runner installs one.
      - name: The MSIs, from the publish and the zip's pitboard.exe
        shell: pwsh
        working-directory: apps/windows
        env:
          TRIPLE: ${{ matrix.triple }}
          INSTALLER: ${{ matrix.installer }}
          VERSION: ${{ steps.gate.outputs.version }}
          FILE_VERSION: ${{ steps.gate.outputs.file }}
          MSI_VERSION: ${{ steps.gate.outputs.msi }}
          MSI_VERSION_B: ${{ steps.gate.outputs.msi-b }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Join-Path $env:GITHUB_WORKSPACE '.github\scripts'
          $app = Join-Path $env:RUNNER_TEMP 'app'
          $top = "pitboard-v$env:VERSION-$env:TRIPLE"
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP "dist\$top.zip") -DestinationPath (Join-Path $env:RUNNER_TEMP 'zip')
          $commandLine = Join-Path $env:RUNNER_TEMP "zip\$top\pitboard.exe"
          $completions = Join-Path $env:RUNNER_TEMP "zip\$top\completions\pitboard.ps1"
          $folder = (New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'session\msi')).FullName
          $msis = [ordered]@{ a = $env:MSI_VERSION }
          if ($env:INSTALLER -eq 'arm64') { $msis.b = $env:MSI_VERSION_B }
          foreach ($kind in $msis.Keys) {
            # An intermediate folder each, so neither build takes the other's output for its own.
            $out = Join-Path $env:RUNNER_TEMP "msi-$kind"
            dotnet build Pitboard.Installer -c Release -o $out "-p:IntermediateOutputPath=obj\$kind\" "-p:InstallerPlatform=$env:INSTALLER" `
              "-p:PitboardApp=$app" "-p:PitboardCommandLine=$commandLine" "-p:PitboardCompletions=$completions" `
              "-p:PitboardMsiVersion=$($msis[$kind])" '-p:PitboardShareSigned=false'
            if ($LASTEXITCODE -ne 0) { throw "dotnet build exited $LASTEXITCODE" }
            $suffix = if ($kind -eq 'b') { '-b' } else { '' }
            $msi = Join-Path $folder "Pitboard-v$env:VERSION-windows-$env:INSTALLER$suffix.msi"
            Move-Item -LiteralPath (Join-Path $out 'Pitboard.msi') -Destination $msi
            & (Join-Path $scripts 'validate-windows-msi.ps1') -Msi $msi
            $image = & (Join-Path $scripts 'extract-msi.ps1') -Msi $msi -Destination (Join-Path $env:RUNNER_TEMP "image-$kind")
            & (Join-Path $scripts 'check-windows-app.ps1') -Folder $image -Triple $env:TRIPLE `
              -GatedLibrary (Join-Path $env:GITHUB_WORKSPACE 'target\release\pitboard_ffi.dll') -UpdateKey $env:UPDATE_TEST_KEY `
              -Version $env:VERSION -FileVersion $env:FILE_VERSION
            & (Join-Path $scripts 'check-windows-msi.ps1') -Msi $msi -Folder $image -MsiVersion $msis[$kind] -CommandLine $commandLine `
              -Completions $completions
            $ours = @(Get-ChildItem -LiteralPath $image -Recurse -File |
              Where-Object { $_.Name -like 'pitboard*' -and $_.Extension -in '.exe', '.dll', '.msix' } | ForEach-Object FullName)
            & (Join-Path $scripts 'verify-windows-signatures.ps1') -Path $ours -Mode unsigned
            Write-Output "Built $msi, version $($msis[$kind])."
          }
      - name: The zip and the probes
        if: matrix.installer == 'arm64'
        env:
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          bundle="$RUNNER_TEMP/session"
          mkdir -p "$bundle/zip" "$bundle/probe"
          cp "$RUNNER_TEMP/dist/pitboard-v$VERSION-$TRIPLE.zip" "$bundle/zip/"
          cargo build --locked -p pitboard-probe --bin pitboard-probe
          cp target/debug/pitboard-probe.exe "$bundle/probe/"
          cd apps/windows
          dotnet publish Pitboard.Probe -c Release -r "$RUNTIME" -p:Platform="$PLATFORM" -o "$bundle/probe/Pitboard.Probe"
      - name: The bundle, summed, zipped and encrypted to the owner's key
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          AGE: ${{ steps.age.outputs.exe }}
          KEY: ${{ steps.gate.outputs.recipient }}
        run: >
          ./.github/scripts/pack-session-bundle.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'session')
          -Name "session-build-$env:TRIPLE" -Out (Join-Path $env:RUNNER_TEMP 'sealed') -Age $env:AGE -Recipient $env:KEY
      # Overwritten, so a leg run again can upload its bundle again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-build-${{ matrix.triple }}
          path: ${{ runner.temp }}/sealed/session-build-${{ matrix.triple }}.zip.age
          if-no-files-found: error
          retention-days: 1
          overwrite: true
