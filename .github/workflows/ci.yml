name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request cancels the run it replaces. A push to main is a group of its own,
# so every commit on main keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: false
      - run: cargo fmt --check

  clippy:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo clippy --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - run: cargo clippy -p pitboard-model --all-targets --locked --features fixture

  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.146
      - run: cargo nextest run --locked --profile ci
      # The fixtures, each a world on the real core, which only a build with the feature has.
      # The crate's other tests ran above, and the feature changes none of them.
      - run: cargo nextest run --locked --profile ci -p pitboard-model --features fixture -E 'test(/^fixture::/)'
      # Both runs write this report, and a step that fails is the last to run.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-macos-latest
          path: target/nextest/ci/junit.xml

  # Linux on both machines a release is built for, with glibc and with musl. Each image is named,
  # never ubuntu-latest. Only the command line ships for musl, so a musl row builds it and the
  # core alone. The tests run as AGENTS.md's On Linux asks, through test-in-fresh-homes.sh.
  linux:
    name: linux (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            triple: x86_64-unknown-linux-gnu
            libc: gnu
          - os: ubuntu-26.04-arm
            triple: aarch64-unknown-linux-gnu
            libc: gnu
          - os: ubuntu-26.04
            triple: x86_64-unknown-linux-musl
            libc: musl
          - os: ubuntu-26.04-arm
            triple: aarch64-unknown-linux-musl
            libc: musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.libc == 'musl' && matrix.triple || '' }}
          key: ${{ matrix.libc }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.146
      # The Secret Service the tests start on a bus of their own (`testing::SecretService`).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon gnome-keyring
      # ring compiles C, and needs a compiler that targets musl, as release.yml builds it.
      - if: matrix.libc == 'musl'
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_$(echo "$TRIPLE" | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      # One D-Bus stack, the core's zbus 5, and a command line that links no tokio
      # (docs/facts/linux.md, zbus). `-i` fails where two zbus make the name ambiguous.
      - name: One zbus, and no tokio in the command line
        run: |
          cargo tree --locked --workspace --target "$TRIPLE" -i zbus --depth 0
          linked=$(cargo tree --locked -p pitboard --target "$TRIPLE" -e normal,build \
            --prefix none --format '{p}')
          if printf '%s\n' "$linked" | grep '^tokio '; then
            echo "pitboard links tokio on $TRIPLE" >&2
            exit 1
          fi
      - if: matrix.libc == 'gnu'
        run: cargo clippy --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - if: matrix.libc == 'gnu'
        run: cargo clippy -p pitboard-model --all-targets --locked --features fixture
      - if: matrix.libc == 'musl'
        run: cargo clippy -p pitboard-core -p pitboard --all-targets --locked --target "$TRIPLE"
      - if: matrix.libc == 'gnu'
        run: sh .github/scripts/test-in-fresh-homes.sh --locked --profile ci
      # The crate's other tests ran above, and the feature changes none of them.
      - if: matrix.libc == 'gnu'
        run: >
          sh .github/scripts/test-in-fresh-homes.sh --locked --profile ci
          -p pitboard-model --features fixture -E 'test(/^fixture::/)'
      - if: matrix.libc == 'musl'
        run: >
          sh .github/scripts/test-in-fresh-homes.sh --locked --profile ci
          -p pitboard-core -p pitboard --target "$TRIPLE"
      # Both runs of a glibc row write this report, and a step that fails is the last to run.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.triple }}
          path: target/nextest/ci/junit.xml

  # The install script under each shell named here, with no network, and the release's scripts.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: sh dash bash zsh busybox
          - os: macos-latest
            shells: sh dash bash zsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Ubuntu image has neither zsh nor BusyBox, and the script has to run under both, nor
      # the validators check-linux-app.sh runs.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh busybox desktop-file-utils appstream
      # 0.11.0 takes test's -ef from POSIX.1-2024; the Ubuntu image has 0.9.0.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0
      - if: runner.os == 'Linux'
        run: >
          shellcheck -s sh packaging/install.sh .github/scripts/fill-template.sh
          .github/scripts/core-unchanged.sh .github/scripts/release-kind.sh
          .github/scripts/windows-versions.sh .github/scripts/windows-update-key.sh
          .github/scripts/windows-update-sign.sh .github/scripts/session-gate.sh
          .github/scripts/test-in-fresh-homes.sh .github/scripts/linux-runner-facts.sh
          apps/macos/scripts/build-number.sh
          .github/scripts/check-linux-app.sh apps/linux/scripts/cargo-build.sh
          apps/linux/scripts/install-deps.sh apps/linux/scripts/headless.sh
          apps/linux/scripts/in-container.sh apps/linux/scripts/check.sh
      - env:
          TEST_INSTALL_SHELLS: ${{ matrix.shells }}
        run: python3 .github/scripts/test-install.py
      - run: python3 .github/scripts/test-release.py
      # check-linux-app.sh's cases need Linux's validators, which macOS lacks.
      - env:
          TEST_LINUX_APP_TOOLS: ${{ runner.os == 'Linux' && 'desktop-file-validate appstreamcli' || '' }}
        run: python3 .github/scripts/test-linux-app.py

  # Every test Windows leaves out, by an ignore, a cfg or an early return, gives a reason
  # .github/scripts/windows-pending.py accepts.
  windows-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test-windows-pending.py
      - run: python3 .github/scripts/windows-pending.py

  # Windows, where the core compiles and refuses whatever is not built yet. Each image is
  # named, never windows-latest, so a new image is a change made on purpose.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # RUSTFLAGS replaces every target's own rustflags, so the static C runtime a Windows
      # release is built with is named here. The cfg opens the build to Windows before Windows
      # is released, for the lints and the tests (pitboard-core's release.rs); the gate is
      # checked below on a build without it.
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
      # Every pitboard.exe built here carries its version resource, whatever the image holds.
      PITBOARD_REQUIRE_VERSIONINFO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest@0.9.146
      # Every test step below lists Credential Manager with the probe this builds, for the
      # leak check.
      - uses: ./.github/actions/windows-builds
        with:
          triple: ${{ matrix.triple }}
      # The gated build is a program for this leg's machine, answers its version, carries its
      # version resource and manifest, holds its C runtime and no test's variable, and refuses
      # every command with windows_not_released, leaving every folder it is pointed at empty.
      # From 1.0.0 it runs as a standard user instead.
      - name: "The gated build: machine, C runtime, version, resources and the gate"
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
        run: >
          ./.github/scripts/check-windows-build.ps1 -Exe target/gated/debug/pitboard.exe
          -Triple $env:TRIPLE -Probe target/debug/pitboard-probe.exe
      # Before windows_refuses, whose build for tests replaces the gated pitboard.exe.
      - name: The release's Windows scripts
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
        run: >
          ./.github/scripts/test-windows-release.ps1 -Exe target/gated/debug/pitboard.exe
          -Triple $env:TRIPLE -Probe target/debug/pitboard-probe.exe
      # Tests from here run as a fresh standard user: the job's user is elevated in every program.
      # windows_refuses as it runs against a build that is not opened: every one of its
      # changes and reads refuses with windows_not_released, and every folder stays empty.
      - name: windows_refuses, not opened, as a standard user
        shell: pwsh
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
        run: >
          ./.github/scripts/test-as-standard-user.ps1 -Cargo '--locked -p pitboard --test cli'
          -Filter 'test(/^windows_refuses::/)' -Probe target/debug/pitboard-probe.exe
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy -p pitboard-model --all-targets --locked --features fixture
      # No filter and no --skip: the windows-pending job checks each test left out says why.
      # -ExFat mounts the volume a test replaces a file on through MoveFileExW.
      - name: The workspace's tests, as a standard user
        shell: pwsh
        run: >
          ./.github/scripts/test-as-standard-user.ps1 -Cargo '--locked --workspace'
          -Probe target/debug/pitboard-probe.exe -ExFat
      # The crate's other tests ran above, and the feature changes none of them.
      - name: pitboard-model's fixture tests, as a standard user
        shell: pwsh
        run: >
          ./.github/scripts/test-as-standard-user.ps1 -Cargo '--locked -p pitboard-model --features fixture'
          -Filter 'test(/^fixture::/)' -Probe target/debug/pitboard-probe.exe
      # Each run writes its report under its target folder, and a step that fails is the last to run.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: |
            target/nextest/ci/junit.xml
            target/gated/nextest/ci/junit.xml
      # Runs the opened pitboard.exe the workspace's tests built.
      - name: An opened build refuses a change as the elevated job user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target\debug\pitboard.exe').Path
          $root = Join-Path $env:RUNNER_TEMP 'elevated-refusal'
          $folders = 'USERPROFILE', 'HOME', 'APPDATA', 'LOCALAPPDATA', 'CODEX_HOME', 'CLAUDE_CONFIG_DIR', 'PITBOARD_HOME'
          foreach ($folder in $folders) {
            $path = Join-Path $root $folder
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            Set-Item -Path "env:$folder" -Value $path
          }
          foreach ($command in @(@('use', 'x', '--json'), @('renew', '--json'))) {
            $printed = & $exe @command | Out-String
            $exit = $LASTEXITCODE
            $refusal = ($printed | ConvertFrom-Json).error
            if ($exit -ne 1 -or $refusal.code -ne 'elevated') {
              throw "pitboard $($command -join ' ') exited $exit with $($refusal.code)`: $printed"
            }
            if ($refusal.message -notmatch 'as every program this Windows account starts does') {
              throw "the job user's token is not split, so the refusal names every program: $($refusal.message)"
            }
            Write-Output "pitboard $($command -join ' '): $($refusal.message)"
          }
          foreach ($folder in $folders) {
            $left = @(Get-ChildItem -Force -Path (Join-Path $root $folder))
            if ($left.Count -ne 0) { throw "$folder holds $($left.Name -join ', ')" }
          }
          exit 0
      # The standard user's fresh profile has no app execution alias to read; the job user's has.
      - name: The job user's own app execution aliases, read only
        env:
          PITBOARD_TEST_ALIASES: '1'
        run: >
          cargo nextest run --locked --workspace --no-capture
          -E 'binary_id(pitboard-core) & test(=host::windows::proc::tests::an_app_execution_alias_runs_from_windows_apps)'
      # winget's validation installs as a standard user, runs the program with no argument and
      # wants 0, and the opened build is held to it as the gated 1.x build is.
      - name: The opened build with no argument, as a standard user
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
        run: >
          ./.github/scripts/check-windows-build.ps1 -Exe target/debug/pitboard.exe -Triple $env:TRIPLE
          -Opened -Strict -Probe target/debug/pitboard-probe.exe

  # The zips release.yml ships from 1.0.0, built by the same action on each image. Nothing is
  # uploaded, so no runnable build of a pull request leaves the runner.
  windows-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: manifest
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/windows-release
        with:
          triple: ${{ matrix.triple }}
          version: ${{ steps.manifest.outputs.version }}

  # The floor the manifests promise, on Windows. ring compiles C against the target's own
  # headers, so a Windows check needs a Windows C toolchain: the MSVC this image has, never
  # a cross-check from Linux.
  windows-msrv:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45
      # --rust-version installs the rust-version in Cargo.toml and checks with it; the
      # workspace behaviour keeps it one cargo check, not one per package.
      - run: cargo hack check --rust-version --workspace-behavior=cargo --workspace --exclude pitboard-linux --all-targets --locked
      - run: cargo hack check --rust-version --workspace-behavior=cargo -p pitboard-model --all-targets --locked --features fixture

  apple:
    # The image and the Xcode are named, so a new one is a change made on purpose.
    runs-on: macos-26
    # Each UI test has its own allowance below; this stops a job stuck anywhere else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The newest Xcode on macos-26, which the release's macos-latest builds with too.
      # Development uses 27.1, and what only macOS 27's SDK knows sits behind
      # compiler(>=6.4), which the xcode-27 job builds.
      - run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      # rusqlite is macOS's alone, so only a Mac proves the floor builds it.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45
      - run: cargo hack check --rust-version --workspace-behavior=cargo -p pitboard-core -p pitboard -p pitboard-model --all-targets --locked
      # PitboardBindings and PitboardShareBindings are generated, so only what is written by
      # hand is checked.
      - run: >
          swift format lint --strict --recursive --configuration apps/macos/.swift-format
          apps/macos/Sources/PitboardApp apps/macos/Sources/PitboardKit apps/macos/Sources/PitboardLinkTarget
          apps/macos/Sources/PitboardGlance apps/macos/Sources/PitboardWidgetViews
          apps/macos/App apps/macos/ShareExtension apps/macos/Widgets apps/macos/UITests apps/macos/Tests apps/macos/scripts
          .github/scripts
      - uses: ./.github/actions/xcodegen
      # Proves the core still links into the app, that its bindings still match, and that
      # the bundle still assembles and signs.
      - run: ./apps/macos/scripts/build-app.sh
      # The command line the app comes with is what its renewal schedule runs and what the
      # cask puts on PATH, so it is run from inside the bundle, checked for both
      # architectures, and the bundle verified with it in place.
      - run: |
          helper=apps/macos/build/Pitboard.app/Contents/Helpers/pitboard
          "$helper" --version
          for arch in arm64 x86_64; do lipo "$helper" -verify_arch "$arch"; done
          codesign --verify --strict --deep apps/macos/build/Pitboard.app
      # The core again, with its fixtures: the worlds the debug build and the UI tests
      # launch into, and the one the package's tests start a model in, are Rust's, and only
      # a library built so has them. Their bindings are the same either way. Only after the
      # release is built and checked above, since this empties apps/macos/build, and
      # build-app.sh never passes it.
      - run: ./apps/macos/scripts/build-xcframework.sh --fixture
      # The widgets' entries are drawn offscreen here, as no UI test can place a widget, and kept
      # for pull requests beside macos-app-pictures.
      - id: package
        env:
          PITBOARD_WIDGET_RENDERS: ${{ runner.temp }}/macos-widget-pictures
        run: |
          mkdir -p "$PITBOARD_WIDGET_RENDERS"
          swift test --package-path apps/macos
      - if: success() || steps.package.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-widget-pictures
          path: ${{ runner.temp }}/macos-widget-pictures
          if-no-files-found: error
          retention-days: 7
      # The app driven the way a person drives it: the debug build, started by each test in
      # a fixture rather than on this runner's own accounts. A UI test needs Automation Mode,
      # which asks for a password unless the machine allows it without one. GitHub's macOS
      # images are built to allow it and check that they do, and a runner that did not
      # would hang until the test timed out, so that is said first and plainly. Each test
      # fails alone after two minutes, five times the slowest one's 22 s in CI, and the rest
      # still run. SiteFiguresTests read the app for the site's facts, so a pull request that
      # changes neither the app nor those facts skips them; its checkout is the merge commit,
      # whose first parent is the base. ScreenshotTests run last, in a run of their own:
      # XCTest sets this Mac to Light, then to Dark, for each of them and leaves it in Dark
      # (docs/facts/macos-app.md).
      - id: ui
        run: |
          mode=$(automationmodetool)
          echo "$mode"
          case "$mode" in
            *"DOES NOT REQUIRE"*) ;;
            *) echo "this runner asks for a password before UI tests can run" >&2; exit 1 ;;
          esac
          skip=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet HEAD^1 HEAD -- \
            apps crates docs/facts/site.md .github/workflows/ci.yml; then
            echo "nothing SiteFiguresTests read changed"
            skip=(-skip-testing:PitboardUITests/SiteFiguresTests)
          fi
          run=(-project apps/macos/Pitboard.xcodeproj -scheme Pitboard
            -destination 'platform=macOS' -derivedDataPath apps/macos/build/UITestData
            -clonedSourcePackagesDirPath apps/macos/build/SourcePackages
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120)
          failed=0
          xcodebuild test "${run[@]}" -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -skip-testing:PitboardUITests/ScreenshotTests "${skip[@]}" || failed=1
          xcodebuild test-without-building "${run[@]}" \
            -resultBundlePath "$RUNNER_TEMP/Pictures.xcresult" \
            -only-testing:PitboardUITests/ScreenshotTests || failed=1
          xcrun xcresulttool merge --output-path "$RUNNER_TEMP/UITests.xcresult" \
            "$RUNNER_TEMP/Tests.xcresult" "$RUNNER_TEMP/Pictures.xcresult"
          exit "$failed"
      # The result bundle has what the log cannot: a screenshot and the tree of elements at
      # the moment a test failed. Nobody needs it when they all pass.
      - if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UITests.xcresult
          path: ${{ runner.temp }}/UITests.xcresult
      # What the tests kept: ScreenshotTests' pictures and SiteFiguresTests' readings and pictures,
      # which docs/facts/site.md records for usepitboard.com's figures.
      - if: success() || steps.ui.outcome == 'failure'
        run: >
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/UITests.xcresult"
          --output-path "$RUNNER_TEMP/macos-app-pictures"
      - if: success() || steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-pictures
          path: ${{ runner.temp }}/macos-app-pictures
          if-no-files-found: error
          retention-days: 7

  # The app, its widget extension and PitboardGlance built with Xcode 27, unsigned, so the code
  # behind compiler(>=6.4) compiles somewhere; nothing here runs, and nothing is kept. Run
  # 40506912858 read the image as xcode-27-arm64 on macOS 27.0.1, with Xcode 27.1 selected, the
  # one development uses, so it is named, as the apple job names its own.
  xcode-27:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app
          xcodebuild -version
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - uses: ./.github/actions/xcodegen
      - run: ./apps/macos/scripts/build-xcframework.sh
      - run: xcodegen generate --spec apps/macos/project.yml --quiet
      - run: >
          xcodebuild -project apps/macos/Pitboard.xcodeproj -scheme Pitboard -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath apps/macos/build/DerivedData
          -clonedSourcePackagesDirPath apps/macos/build/SourcePackages
          -onlyUsePackageVersionsFromResolvedFile -quiet
          ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

  csharp:
    # The Windows app reaches the core through these bindings, and PitboardShare.exe reaches
    # pitboard-share-ffi through its own. They are generated from the libraries, compiled and
    # called on every change, so a change C# cannot express, or bindings that no longer match
    # the library, fail here rather than in the app.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - run: |
          cargo build --locked --release -p pitboard-ffi
          cargo build --locked --release -p pitboard-share-ffi
      # Read from the static library: the release profile strips the shared one, and with
      # it the metadata the generator reads, which it answers by writing nothing at all.
      - run: |
          mkdir -p apps/windows/Pitboard.Core/Generated apps/windows/Pitboard.Share.Core/Generated
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_ffi.a \
            --out-dir apps/windows/Pitboard.Core/Generated \
            --config crates/pitboard-model/uniffi.toml --no-format
          test -s apps/windows/Pitboard.Core/Generated/pitboard_model.cs
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_share_ffi.a \
            --out-dir apps/windows/Pitboard.Share.Core/Generated \
            --config crates/pitboard-share-ffi/uniffi.toml --no-format
          test -s apps/windows/Pitboard.Share.Core/Generated/pitboard_share_ffi.cs
      # For csharp-windows, which generates its own and compares, so one file serves every system.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-bindings
          path: apps/windows/Pitboard.Core/Generated/pitboard_model.cs
          if-no-files-found: error
          retention-days: 7
      # global.json, which pins the SDK and the test platform, is read from where dotnet runs.
      # The tests of a fixture's model are skipped here, against a library with no fixtures.
      - working-directory: apps/windows
        run: >
          dotnet test --solution Pitboard.slnx
          -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_ffi.so"
          -p:PitboardShareNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_share_ffi.so"
      # The same library with its fixtures, which a debug build of either app launches into.
      # Its bindings must be the very ones generated without them, which is what lets one
      # set serve both, and the library without them must hold none of a fixture's text.
      - run: |
          sh .github/scripts/no-fixture-text.sh target/release/libpitboard_ffi.so
          cargo build --locked --release -p pitboard-ffi --features fixture
          mkdir -p "$RUNNER_TEMP/fixture-bindings"
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_ffi.a \
            --out-dir "$RUNNER_TEMP/fixture-bindings" \
            --config crates/pitboard-model/uniffi.toml --no-format
          cmp apps/windows/Pitboard.Core/Generated/pitboard_model.cs \
            "$RUNNER_TEMP/fixture-bindings/pitboard_model.cs"
      # Here the fixtures' models are started, and call the Listener, OtherApps,
      # Notifier and LocalTime written in C# from threads of their own.
      - working-directory: apps/windows
        run: >
          dotnet test --solution Pitboard.slnx
          -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_ffi.so"
          -p:PitboardShareNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_share_ffi.so"

  # The bindings on Windows, against pitboard_ffi.dll as a 0.x release builds it and opened with
  # its fixtures, on each image the windows job names. Both test programs are published
  # self-contained by the job's user and run as a fresh standard user, as the windows job's
  # tests are.
  csharp-windows:
    needs: csharp
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            runtime: win-x64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            runtime: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # As the windows job has them, for the opened library and the leak check's probe.
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - uses: ./.github/actions/windows-builds
        with:
          triple: ${{ matrix.triple }}
          gated-pitboard: 'false'
      # No fixture feature and no cfg, so the release gate is closed, and none of a fixture's
      # text is in it.
      - name: pitboard_ffi.dll as a 0.x release builds it
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
        run: |
          cargo build --locked --release -p pitboard-ffi
          sh .github/scripts/no-fixture-text.sh target/gated/release/pitboard_ffi.dll
      - name: pitboard_ffi.dll opened, with its fixtures
        run: cargo build --locked --release -p pitboard-ffi --features fixture
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csharp-bindings
          path: ${{ runner.temp }}/linux-bindings
      # Read from each DLL itself: unlike Linux's shared library, it keeps the exports the
      # generator reads through the release profile's strip. The generator is built beside the
      # gated library.
      - name: Both libraries' bindings are Linux's, byte for byte
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
          LINUX: ${{ runner.temp }}/linux-bindings/pitboard_model.cs
          OPENED: ${{ runner.temp }}/opened-bindings
        run: |
          mkdir -p apps/windows/Pitboard.Core/Generated "$OPENED"
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/gated/release/pitboard_ffi.dll \
            --out-dir apps/windows/Pitboard.Core/Generated \
            --config crates/pitboard-model/uniffi.toml --no-format
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/pitboard_ffi.dll --out-dir "$OPENED" \
            --config crates/pitboard-model/uniffi.toml --no-format
          cmp "$LINUX" apps/windows/Pitboard.Core/Generated/pitboard_model.cs
          cmp "$LINUX" "$OPENED/pitboard_model.cs"
      # Published by the job's user, whose profile holds the SDK and the NuGet packages, into
      # the workspace the standard user is granted read and run on. The opened program passes
      # its tests with the gated library too, so each is compared with the library it was given.
      - name: The tests as a program of their own for each library
        working-directory: apps/windows
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          dotnet publish Pitboard.Core.Tests -c Release -r "$RUNTIME" --self-contained \
            -o "$GITHUB_WORKSPACE/target/csharp/gated" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/gated/release/pitboard_ffi.dll"
          dotnet publish Pitboard.Core.Tests -c Release -r "$RUNTIME" --self-contained \
            -o "$GITHUB_WORKSPACE/target/csharp/opened" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" \
            -p:PitboardNativeLibraryOpened=true
          cd "$GITHUB_WORKSPACE"
          cmp target/gated/release/pitboard_ffi.dll target/csharp/gated/pitboard_ffi.dll
          cmp target/release/pitboard_ffi.dll target/csharp/opened/pitboard_ffi.dll
      - name: The C# tests, as a standard user
        shell: pwsh
        run: >
          ./.github/scripts/test-as-standard-user.ps1
          -Dotnet target/csharp/gated/Pitboard.Core.Tests.exe, target/csharp/opened/Pitboard.Core.Tests.exe
          -Probe target/debug/pitboard-probe.exe

  # The Windows app on each image the windows job names: a Debug build over pitboard_ffi.dll
  # opened with its fixtures, and a Release build over the library as a 0.x release builds it,
  # with PitboardShare.exe and its package, signed with a throwaway certificate and registered
  # nowhere, and the MSI of that build, extracted and never installed. Its tests run as a fresh
  # standard user, and an elevated launch as the job's user. Nothing is uploaded, so no runnable
  # build of a pull request leaves the runner.
  windows-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            installer: x64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            installer: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # Where dotnet build puts a WinUI project's Debug build, under the project.
      BUILT: bin/${{ matrix.platform }}/Debug/net10.0-windows10.0.26100.0/${{ matrix.runtime }}
      # The subject of the throwaway certificate PitboardShare's package is signed with here.
      SHARE_TEST_SIGNER: CN=Pitboard Share Test
      # The Release build's update key: 32 bytes no private key was made for, so it accepts no update.
      UPDATE_TEST_KEY: q1exPQ+LBkab+sdFuHAN+8eRpiHNak3rq4kpW8aH2G4=
      # pitboard_ffi.dll and pitboard_share_ffi.dll carry a version resource, as a release's do.
      PITBOARD_REQUIRE_VERSIONINFO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - uses: ./.github/actions/windows-builds
        with:
          triple: ${{ matrix.triple }}
          gated-pitboard: 'false'
      # Cargo.toml's version, and the MSI, file and package numbers a release gives it.
      - id: manifest
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sh .github/scripts/windows-versions.sh "$version" >> "$GITHUB_OUTPUT"
      # pitboard.exe for the MSI's bin folder.
      - name: pitboard_ffi.dll, pitboard_share_ffi.dll and pitboard.exe as a 0.x release builds them
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
        run: |
          cargo build --locked --release -p pitboard-ffi
          cargo build --locked --release -p pitboard-share-ffi
          cargo build --locked --release -p pitboard
      - name: pitboard_ffi.dll opened, with its fixtures
        run: cargo build --locked --release -p pitboard-ffi --features fixture
      # csharp-windows checks that both libraries give the core's bindings, byte for byte.
      - name: The bindings
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
        run: |
          mkdir -p apps/windows/Pitboard.Core/Generated apps/windows/Pitboard.Share.Core/Generated
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/gated/release/pitboard_ffi.dll \
            --out-dir apps/windows/Pitboard.Core/Generated \
            --config crates/pitboard-model/uniffi.toml --no-format
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/gated/release/pitboard_share_ffi.dll \
            --out-dir apps/windows/Pitboard.Share.Core/Generated \
            --config crates/pitboard-share-ffi/uniffi.toml --no-format
      # The build fails on .editorconfig's style rules; this checks the layout too.
      - name: The C# is laid out as .editorconfig says
        working-directory: apps/windows
        run: dotnet format whitespace --folder --verify-no-changes .
      # Built where it runs, the ARM64 app on windows-11-arm (CF6), by the job's user into the
      # workspace, where the standard user may read and run it. A WinUI Debug build runs from the
      # folder it builds into: a Debug publish leaves out the XAML files it reads beside it (run
      # 38770866775), and -o, which sets OutputPath without its trailing slash, names them
      # wrong in its PRI file (run 38774669459). The Release build is published, as a release is,
      # PitboardShare.exe beside Pitboard.exe as the MSI lays them out.
      - name: The app, its unit tests and its UI tests
        working-directory: apps/windows
        env:
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.manifest.outputs.version }}
          FILE_VERSION: ${{ steps.manifest.outputs.file }}
          WINDOWS_SIGNER_SUBJECT: ${{ env.SHARE_TEST_SIGNER }}
        run: |
          out="$GITHUB_WORKSPACE/target/windows-app"
          # Main's Cargo cache keeps target, and with it what the run that saved it built here.
          rm -rf "$out"
          dotnet build Pitboard.App -c Debug -r "$RUNTIME" -p:Platform="$PLATFORM" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll"
          dotnet publish Pitboard.App -c Release -r "$RUNTIME" -p:Platform="$PLATFORM" -o "$out/release" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/gated/release/pitboard_ffi.dll" \
            -p:WINDOWS_UPDATE_PUBLIC_KEY="$UPDATE_TEST_KEY" -p:Version="$VERSION" -p:FileVersion="$FILE_VERSION"
          dotnet publish Pitboard.Share -c Release -r "$RUNTIME" -o "$out/release" -p:Version="$VERSION" \
            -p:FileVersion="$FILE_VERSION" \
            -p:PitboardShareNativeLibrary="$GITHUB_WORKSPACE/target/gated/release/pitboard_share_ffi.dll"
          dotnet publish Pitboard.Share.Core.Tests -c Release -r "$RUNTIME" --self-contained -o "$out/share-tests" \
            -p:PitboardShareNativeLibrary="$GITHUB_WORKSPACE/target/gated/release/pitboard_share_ffi.dll"
          dotnet build Pitboard.Windows.Tests -c Debug -r "$RUNTIME" -p:Platform="$PLATFORM" --self-contained \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll"
          dotnet publish Pitboard.Probe -c Release -r "$RUNTIME" -p:Platform="$PLATFORM" -o "$out/probe"
          cmp "$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" "Pitboard.App/$BUILT/pitboard_ffi.dll"
          cmp "$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" "Pitboard.Windows.Tests/$BUILT/pitboard_ffi.dll"
          cmp "$GITHUB_WORKSPACE/target/gated/release/pitboard_share_ffi.dll" "$out/release/pitboard_share_ffi.dll"
      # makeappx validates the manifest as it packs. Signing proves the package signs; nothing
      # trusts the certificate, and nothing registers the package.
      - name: PitboardShare's package, packed and signed with a throwaway certificate
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.manifest.outputs.package }}
        run: >
          ./.github/scripts/pack-windows-share.ps1 -Folder target/windows-app/release
          -Publisher $env:SHARE_TEST_SIGNER -Version $env:PACKAGE_VERSION -TestCertificate
      # In the environment the gated pitboard_ffi.dll was built in, as a release runs it.
      - name: "The Release build: no fixture, identity on PitboardShare.exe alone, its update key, one version, the release gate, the core's C runtime inside it"
        shell: pwsh
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.manifest.outputs.version }}
          FILE_VERSION: ${{ steps.manifest.outputs.file }}
        run: >
          ./.github/scripts/check-windows-app.ps1 -Folder target/windows-app/release -Triple $env:TRIPLE
          -GatedLibrary target/gated/release/pitboard_ffi.dll -Signer $env:SHARE_TEST_SIGNER -UpdateKey $env:UPDATE_TEST_KEY
          -Version $env:VERSION -FileVersion $env:FILE_VERSION
      # ICE validates the MSI as it builds. CI never installs one: msiexec /a extracts its files
      # and registers nothing. The image is Pitboard as an install lays it out, which the UI
      # tests start in place of the Release folder (CF10). The package above is signed, so the
      # MSI carries PitboardShare.exe, as a signed release's does. The unsigned MSI is built from
      # the folder a release without a signer publishes, which holds no share target.
      - name: The MSIs and their administrative images
        id: msi
        shell: pwsh
        working-directory: apps/windows
        env:
          INSTALLER: ${{ matrix.installer }}
          MSI_VERSION: ${{ steps.manifest.outputs.msi }}
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'target\windows-app'
          $commandLine = Join-Path $env:GITHUB_WORKSPACE 'target\gated\release\pitboard.exe'
          # The PowerShell completions the release's zip holds beside that pitboard.exe.
          $zip = & "$env:GITHUB_WORKSPACE/.github/scripts/package-windows.ps1" -Exe $commandLine -Version $env:VERSION -Triple $env:TRIPLE `
            -Out (Join-Path $out 'zip')
          $completions = Join-Path ($zip -replace '\.zip$', '') 'completions\pitboard.ps1'
          "completions=$completions" >> $env:GITHUB_OUTPUT
          $unsigned = Join-Path $out 'release-unsigned'
          Copy-Item -LiteralPath (Join-Path $out 'release') -Destination $unsigned -Recurse
          $share = @(Get-ChildItem -LiteralPath $unsigned -File -Filter 'PitboardShare.*') +
            @('pitboard_share_ffi.dll', 'Assets\Square150x150Logo.png', 'Assets\Square44x44Logo.png', 'Assets\StoreLogo.png' |
              ForEach-Object { Get-Item -LiteralPath (Join-Path $unsigned $_) })
          $share | Remove-Item
          # Only Pitboard.Share has an Assets folder. Delete throws if anything else is in it.
          [IO.Directory]::Delete((Join-Path $unsigned 'Assets'))
          # An intermediate folder each, so neither build takes the other's output for its own.
          foreach ($kind in @{ Name = 'msi'; App = 'release'; Signed = 'true' }, @{ Name = 'msi-unsigned'; App = 'release-unsigned'; Signed = 'false' }) {
            dotnet build Pitboard.Installer -c Release -o (Join-Path $out $kind.Name) "-p:IntermediateOutputPath=obj\$($kind.Name)\" `
              "-p:InstallerPlatform=$env:INSTALLER" "-p:PitboardApp=$(Join-Path $out $kind.App)" "-p:PitboardCommandLine=$commandLine" `
              "-p:PitboardCompletions=$completions" "-p:PitboardMsiVersion=$env:MSI_VERSION" "-p:PitboardShareSigned=$($kind.Signed)"
            if ($LASTEXITCODE -ne 0) { throw "dotnet build exited $LASTEXITCODE" }
            $msi = Join-Path $out "$($kind.Name)\Pitboard.msi"
            & "$env:GITHUB_WORKSPACE/.github/scripts/validate-windows-msi.ps1" -Msi $msi
            $folder = & "$env:GITHUB_WORKSPACE/.github/scripts/extract-msi.ps1" -Msi $msi -Destination (Join-Path $out "$($kind.Name)-image")
            Write-Output "Extracted $msi into $folder."
            "$($kind.Name)-folder=$folder" >> $env:GITHUB_OUTPUT
          }
      - name: "The MSIs' files: the checks of the Release build"
        shell: pwsh
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.manifest.outputs.version }}
          FILE_VERSION: ${{ steps.manifest.outputs.file }}
          IMAGE: ${{ steps.msi.outputs.msi-folder }}
          UNSIGNED_IMAGE: ${{ steps.msi.outputs.msi-unsigned-folder }}
        run: |
          ./.github/scripts/check-windows-app.ps1 -Folder $env:IMAGE -Triple $env:TRIPLE `
            -GatedLibrary target/gated/release/pitboard_ffi.dll -Signer $env:SHARE_TEST_SIGNER -UpdateKey $env:UPDATE_TEST_KEY `
            -Version $env:VERSION -FileVersion $env:FILE_VERSION
          ./.github/scripts/check-windows-app.ps1 -Folder $env:UNSIGNED_IMAGE -Triple $env:TRIPLE `
            -GatedLibrary target/gated/release/pitboard_ffi.dll -UpdateKey $env:UPDATE_TEST_KEY `
            -Version $env:VERSION -FileVersion $env:FILE_VERSION
      - name: "The MSIs as a release ships them: their version, their layout, the zip's command line and completions, and the signed package"
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.manifest.outputs.msi }}
          IMAGE: ${{ steps.msi.outputs.msi-folder }}
          UNSIGNED_IMAGE: ${{ steps.msi.outputs.msi-unsigned-folder }}
          COMPLETIONS: ${{ steps.msi.outputs.completions }}
        run: |
          ./.github/scripts/check-windows-msi.ps1 -Msi target/windows-app/msi/Pitboard.msi -Folder $env:IMAGE `
            -MsiVersion $env:MSI_VERSION -CommandLine target/gated/release/pitboard.exe -Completions $env:COMPLETIONS `
            -Share -Package target/windows-app/release/PitboardShare.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/check-windows-msi.ps1 -Msi target/windows-app/msi-unsigned/Pitboard.msi -Folder $env:UNSIGNED_IMAGE `
            -MsiVersion $env:MSI_VERSION -CommandLine target/gated/release/pitboard.exe -Completions $env:COMPLETIONS
          exit $LASTEXITCODE
      # As release.yml's app-windows-package checks a release's, against both MSIs of the newest
      # release that shipped one, read and never extracted.
      - name: The MSIs keep each component's GUID the last release's MSIs gave its key path
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'previous-msi'
          $previous = & ./.github/scripts/previous-msis.ps1 -Installer $env:INSTALLER -Destination $dir
          if (-not $previous) {
            Write-Output 'No release has shipped an MSI for this machine.'
            exit 0
          }
          $last = @(Get-ChildItem -LiteralPath $dir -File -Filter '*.msi' | ForEach-Object FullName)
          foreach ($msi in 'msi', 'msi-unsigned') {
            ./.github/scripts/check-msi-components.ps1 -Msi "target/windows-app/$msi/Pitboard.msi" -Previous $last
          }
      # The MSI unsigned and its package signed with the throwaway certificate, as a signed release
      # carries one, both read by the release's signature check.
      - name: "The checks refuse a package identity anywhere but on PitboardShare.exe, or another than its package's, another update key, feed, version or MSI, and the signature check reads the MSI and the package"
        shell: pwsh
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ steps.manifest.outputs.version }}
          FILE_VERSION: ${{ steps.manifest.outputs.file }}
          MSI_VERSION: ${{ steps.manifest.outputs.msi }}
          IMAGE: ${{ steps.msi.outputs.msi-folder }}
          COMPLETIONS: ${{ steps.msi.outputs.completions }}
        run: >
          ./.github/scripts/test-windows-app.ps1 -Folder target/windows-app/release -Triple $env:TRIPLE
          -GatedLibrary target/gated/release/pitboard_ffi.dll -Signer $env:SHARE_TEST_SIGNER -UpdateKey $env:UPDATE_TEST_KEY
          -Version $env:VERSION -FileVersion $env:FILE_VERSION -Msi target/windows-app/msi/Pitboard.msi -MsiImage $env:IMAGE
          -MsiVersion $env:MSI_VERSION -CommandLine target/gated/release/pitboard.exe -Completions $env:COMPLETIONS
      - name: The UI tests over the MSI's Pitboard.exe, and each MSI's own tests
        working-directory: apps/windows
        env:
          RUNTIME: ${{ matrix.runtime }}
          IMAGE: ${{ steps.msi.outputs.msi-folder }}
          UNSIGNED_IMAGE: ${{ steps.msi.outputs.msi-unsigned-folder }}
        run: |
          out="$GITHUB_WORKSPACE/target/windows-app"
          dotnet publish Pitboard.UITests -c Debug -r "$RUNTIME" --self-contained -o "$out/uitests" \
            -p:PitboardAppDebug="$GITHUB_WORKSPACE/apps/windows/Pitboard.App/$BUILT/Pitboard.exe" -p:PitboardAppRelease="$IMAGE/Pitboard.exe"
          dotnet publish Pitboard.Installer.Tests -c Release -r "$RUNTIME" --self-contained -o "$out/installer-tests" \
            -p:PitboardMsi="$out/msi/Pitboard.msi" -p:PitboardMsiImage="$IMAGE" -p:PitboardShareSigned=true
          dotnet publish Pitboard.Installer.Tests -c Release -r "$RUNTIME" --self-contained -o "$out/installer-tests-unsigned" \
            -p:PitboardMsi="$out/msi-unsigned/Pitboard.msi" -p:PitboardMsiImage="$UNSIGNED_IMAGE" -p:PitboardShareSigned=false
      # CF5: the self-contained app needs none of these for the standard user.
      - name: The Windows App Runtime packages this image holds
        shell: pwsh
        run: >
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command
          "Get-AppxPackage -AllUsers -Name 'Microsoft.WindowsAppRuntime*' | Format-Table Name, Version, Architecture -AutoSize"
      # CF4: the account windows need the Runtime of the WebView2 SDK the app is built with, or later.
      # Where Microsoft's guide to detecting it looks, per machine and then per user.
      - name: The WebView2 Runtime this image holds
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\Software\$client") |
            ForEach-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          $source = Get-Content -Raw -LiteralPath apps/windows/Pitboard.Windows/WebEnvironment.cs
          $minimum = [regex]::Match($source, 'MinimumRuntime = "([0-9.]+)"').Groups[1].Value
          if (-not $found) { throw 'This image holds no WebView2 Runtime, which the account windows need.' }
          Write-Output "WebView2 Runtime $found; the account windows need $minimum or later."
          if ([version]$found -lt [version]$minimum) {
            throw "This image's WebView2 Runtime, $found, is older than the $minimum the account windows need."
          }
      # Each UI test starts a Pitboard.exe in homes of its own and drives it as that user (CF1, CF2), the
      # Release build's the one in the MSI's image, which refuses at 0.x (CF10). At 1.x it registers, and
      # its --unregister takes that back before the script's leak check. The job user's Explorer takes no
      # icon of that user's (CF3), so no UI test clicks the icon. The WebView2 tests (CF7) run the account
      # windows' glue against a stand-in site on the loopback. No test starts a Restart Manager session,
      # which Restart Manager keeps under the user's HKCU (CF9 is the session's).
      - name: The app's tests, as a standard user
        shell: pwsh
        run: >
          ./.github/scripts/test-as-standard-user.ps1
          -Dotnet "apps/windows/Pitboard.Windows.Tests/$env:BUILT/Pitboard.Windows.Tests.exe", target/windows-app/uitests/Pitboard.UITests.exe,
          target/windows-app/share-tests/Pitboard.Share.Core.Tests.exe, target/windows-app/installer-tests/Pitboard.Installer.Tests.exe,
          target/windows-app/installer-tests-unsigned/Pitboard.Installer.Tests.exe
          -Results "$env:RUNNER_TEMP/app-tests" -Probe target/debug/pitboard-probe.exe
      # ScreenshotTests' picture of each surface, for the docs and pull requests, also of a run with a test failed. On
      # windows-11-arm a window of the job user's keeps the foreground (CF1), so the test takes none there.
      - name: The app's pictures
        if: matrix.os == 'windows-2025' && (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-pictures
          path: |
            ${{ runner.temp }}/app-tests/Pitboard.UITests/**/*.png
            !${{ runner.temp }}/app-tests/Pitboard.UITests/**/site-*.png
          if-no-files-found: error
          retention-days: 7
      # SiteFiguresTests' readings and pictures, which docs/facts/site.md records for usepitboard.com's figures, from
      # both images: windows-11-arm is the Windows 11 the figures draw.
      - name: The site's readings of the app
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-figures-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/app-tests/Pitboard.UITests/**/site-*.txt
            ${{ runner.temp }}/app-tests/Pitboard.UITests/**/site-*.png
          if-no-files-found: error
          retention-days: 7
      # The job's user is elevated, so of the UI tests only the elevated launch's runs.
      - name: An elevated launch refuses and writes nothing, as the job user
        shell: pwsh
        run: |
          & target/windows-app/uitests/Pitboard.UITests.exe --results-directory (Join-Path $env:RUNNER_TEMP 'elevated')
          exit $LASTEXITCODE
      # Pitboard.Probe registers with Windows, so it runs only in an account its owner marked throwaway.
      - name: The probe refuses an account without the throwaway marker
        shell: pwsh
        run: |
          $said = & target/windows-app/probe/Pitboard.Probe.exe notify 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Output $said
          if ($exit -ne 2 -or -not $said.Contains('pitboard-probe-throwaway.marker')) {
            throw "Pitboard.Probe exited $exit in an account without the marker"
          }
          if (Test-Path -LiteralPath 'HKCU:\Software\Classes\AppUserModelId\Pitboard.Probe') { throw 'Pitboard.Probe registered' }
          exit 0

  # The Linux app on both machines its packages are for, in Ubuntu 26.04's image by digest, with
  # apps/linux/scripts/check.sh's steps, which in-container.sh runs locally: the lint, the tests
  # and Meson's release, installed and checked. A container's user is root, so root builds, and a
  # fresh user runs the tests from a nextest archive under headless.sh, as
  # test-as-standard-user.ps1 does on Windows.
  linux-app:
    name: linux-app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    container:
      image: docker.io/library/ubuntu:26.04@sha256:0e73b71479e7bc5f006bca872e25c3cd680dc052a0116f90d63ae363537db0dd
    timeout-minutes: 45
    env:
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          apps/linux/scripts/install-deps.sh ubuntu-26.04
          echo /opt/cargo/bin >> "$GITHUB_PATH"
      - uses: ./.github/actions/rust
      - run: apps/linux/scripts/check.sh lint
      - run: apps/linux/scripts/check.sh archive "$RUNNER_TEMP/linux-app-tests.tar.zst"
      - name: The tests, as a fresh user under headless.sh
        run: |
          useradd --user-group --no-create-home pitboard-tests
          # nextest writes its report under the workspace's target, whatever the archive's was.
          install -d -o pitboard-tests -g pitboard-tests "$RUNNER_TEMP/linux-app-tests" target/nextest
          setpriv --reuid pitboard-tests --regid pitboard-tests --init-groups \
            apps/linux/scripts/check.sh test "$RUNNER_TEMP/linux-app-tests.tar.zst" "$RUNNER_TEMP/linux-app-tests"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux-app-${{ matrix.arch }}
          path: target/nextest/ci/junit.xml
      - run: apps/linux/scripts/check.sh release

  # The Linux app's floor, Debian 13 by digest, with its GTK 4.18, libadwaita 1.7 and GLib 2.84,
  # and the Rust its manifest names.
  linux-app-floor:
    runs-on: ubuntu-26.04
    container:
      image: docker.io/library/debian:13@sha256:8c4733a92aacd0bcff3779eadc35a4a5147f36cb20a5fcb56504cbc740212259
    timeout-minutes: 45
    env:
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          apps/linux/scripts/install-deps.sh debian-13
          echo /opt/cargo/bin >> "$GITHUB_PATH"
      - uses: ./.github/actions/rust
      - run: apps/linux/scripts/check.sh lint
      - run: apps/linux/scripts/check.sh archive "$RUNNER_TEMP/linux-app-tests.tar.zst"
      - name: The tests, as a fresh user under headless.sh
        run: |
          useradd --user-group --no-create-home pitboard-tests
          # nextest writes its report under the workspace's target, whatever the archive's was.
          install -d -o pitboard-tests -g pitboard-tests "$RUNNER_TEMP/linux-app-tests" target/nextest
          setpriv --reuid pitboard-tests --regid pitboard-tests --init-groups \
            apps/linux/scripts/check.sh test "$RUNNER_TEMP/linux-app-tests.tar.zst" "$RUNNER_TEMP/linux-app-tests"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux-app-floor
          path: target/nextest/ci/junit.xml
      - run: apps/linux/scripts/check.sh floor

  # Fedora 44 by digest. Fedora keeps no snapshot of its archive, so its packages move under the
  # image.
  linux-app-fedora:
    runs-on: ubuntu-26.04
    container:
      image: docker.io/library/fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    timeout-minutes: 30
    env:
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          apps/linux/scripts/install-deps.sh fedora-44
          echo /opt/cargo/bin >> "$GITHUB_PATH"
      - uses: ./.github/actions/rust
      - run: apps/linux/scripts/check.sh lint
      - run: apps/linux/scripts/check.sh archive "$RUNNER_TEMP/linux-app-tests.tar.zst"
      - name: The tests, as a fresh user under headless.sh
        run: |
          useradd --user-group --no-create-home pitboard-tests
          # nextest writes its report under the workspace's target, whatever the archive's was.
          install -d -o pitboard-tests -g pitboard-tests "$RUNNER_TEMP/linux-app-tests" target/nextest
          setpriv --reuid pitboard-tests --regid pitboard-tests --init-groups \
            apps/linux/scripts/check.sh test "$RUNNER_TEMP/linux-app-tests.tar.zst" "$RUNNER_TEMP/linux-app-tests"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux-app-fedora
          path: target/nextest/ci/junit.xml

  # The floor the manifests promise, built the way someone on an older toolchain builds it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45
      - run: cargo hack check --rust-version --workspace-behavior=cargo --workspace --exclude pitboard-linux --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - run: cargo hack check --rust-version --workspace-behavior=cargo -p pitboard-model --all-targets --locked --features fixture

  semver:
    # A pitboard-core API break fails here until crates/pitboard-core/Cargo.toml raises the
    # core's version.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: pitboard-core

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The workflows, actions and scripts in .github themselves.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.30.1
      # Offline, so a run fails only on what the repository holds. Informational findings
      # suggest rewrites, not risks.
      - run: zizmor --offline --min-severity low --config .github/zizmor.yml .
      # The scripts' functions are their own helpers, not published cmdlets, so the naming and
      # -WhatIf rules are left out. The plain-text password each gives the throwaway user it
      # makes is random and never leaves the runner.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Quiet
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $found = Invoke-ScriptAnalyzer -Path .github/scripts -Recurse -Severity Error, Warning `
            -ExcludeRule PSUseSingularNouns, PSUseShouldProcessForStateChangingFunctions, PSAvoidUsingConvertToSecureStringWithPlainText
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
      # The update key rehearsal ships bundles that really do update themselves, so it must
      # never be able to reach the real key, the real certificate or the real feed.
      # windows-facts.yml and linux-facts.yml run on whatever branch they are dispatched on, and
      # windows-facts.yml's session job ships a bundle off the runner. A workflow that never names
      # secrets cannot be handed one, and that is worth knowing on the pull request that changes
      # it rather than the month after.
      - name: The update key rehearsal, the runner facts and the session bundle name no repository secret
        run: |
          for workflow in rotation.yml windows-facts.yml linux-facts.yml; do
            if grep -qw secrets ".github/workflows/$workflow"; then
              echo "$workflow names secrets, so it can be given one" >&2
              exit 1
            fi
          done

  # The usepitboard.com site in website/. A pull request that changes none of the files its
  # build and tests read, listed in `touched`, skips the steps and passes. The build reads the
  # latest release and the betas published above it from GitHub, writes the CSP and fails on any
  # rule guard.mjs keeps.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - id: touched
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- \
            website docs README.md SECURITY.md CHANGELOG.md CONTRIBUTING.md ARCHITECTURE.md \
            packaging apps crates .github/workflows/ci.yml .github/workflows/release.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the site reads changed"
          fi
      - if: steps.touched.outputs.run
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          package-manager-cache: false
      - if: steps.touched.outputs.run
        run: npm ci
      - if: steps.touched.outputs.run
        run: npx prettier --check .
      - if: steps.touched.outputs.run
        run: npm run check
      - if: steps.touched.outputs.run
        run: npm test
      - if: steps.touched.outputs.run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

  # The site in Chromium, WebKit and Firefox and on two phones, served by wrangler with its CSP
  # enforced: e2e/ checks the figures' markup, axe, and in Chromium how each figure looks against
  # baselines made here. It builds from the recorded releases, which a new release leaves alone.
  # One job a Playwright project, each with the one browser it runs.
  website-browsers:
    name: website-browsers (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, firefox, iphone, pixel]
    runs-on: ubuntu-latest
    # Playwright's image for the version website/package.json pins, which holds every browser and
    # what each takes from apt: WebKit's 117 MB from Ubuntu's mirror ran out the job's 17 minutes
    # in run 40543539968. As the runner's user, who owns the checkout.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    # the test step's ten minutes, and seven for the image and the steps before it
    timeout-minutes: 17
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: touched
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- \
            website docs README.md SECURITY.md CHANGELOG.md CONTRIBUTING.md ARCHITECTURE.md \
            packaging apps crates .github/workflows/ci.yml .github/workflows/release.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the site reads changed"
          fi
      - if: steps.touched.outputs.run
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          package-manager-cache: false
      - if: steps.touched.outputs.run
        run: npm ci
      - if: steps.touched.outputs.run
        env:
          PITBOARD_SITE_OFFLINE: "1"
        run: npm run build
      # the slowest project, WebKit, ran 112 of its 113 tests in 6 minutes 12 seconds, and half
      # again makes ten
      - if: steps.touched.outputs.run
        timeout-minutes: 10
        env:
          PROJECT: ${{ matrix.project }}
        run: npm run test:browser -- --project="$PROJECT"
      # the report, and the drawing of a figure with no baseline yet, written where it belongs
      - if: failure() && steps.touched.outputs.run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-browsers-${{ matrix.project }}
          path: |
            website/playwright-report
            website/test-results
            website/e2e/*-snapshots

  # The one check a merge on main needs. It fails when any job above failed or was cancelled,
  # and runs even then, since a required check that was skipped counts as passed. A job added
  # above goes in its needs.
  all-green:
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - linux
      - install-script
      - windows-pending
      - windows
      - windows-release
      - windows-msrv
      - apple
      - xcode-27
      - csharp
      - csharp-windows
      - windows-app
      - linux-app
      - linux-app-floor
      - linux-app-fedora
      - msrv
      - semver
      - deny
      - workflows
      - website
      - website-browsers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
