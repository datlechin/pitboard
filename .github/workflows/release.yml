name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything irreversible waits behind this: publishing to crates.io cannot be undone, and
  # an installed copy reads whatever feed the release publishes. A tag that disagrees with
  # the manifest or has nothing written about it is a mistake, not a release.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          version=${GITHUB_REF_NAME#v}
          # A tag like v0.2.0-rc1 is a release for a few people: a GitHub pre-release, no
          # crates.io upload, and no appcast, so nobody's copy updates itself into it.
          case "$version" in
            *-*) prerelease=true; base=${version%%-*} ;;
            *)   prerelease=false; base=$version ;;
          esac
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$base" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml's $manifest" >&2
            exit 1
          fi
          if [ "$prerelease" = false ] && ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Static, so one binary runs on every distribution whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      # ring compiles C, and needs a compiler that targets musl.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p pitboard --target ${{ matrix.target }}

      # Signed and notarised like the app, so a tarball opened from a browser, which
      # arrives quarantined, is not stopped by Gatekeeper. Without a certificate an ad-hoc
      # signature is what Apple Silicon needs to run a binary at all.
      - if: runner.os == 'macOS'
        id: apple
        uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}
      - if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ steps.apple.outputs.identity }}
          SIGNED: ${{ steps.apple.outputs.signed }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          binary=target/${{ matrix.target }}/release/pitboard
          if [ "$SIGNED" != "true" ]; then
            codesign --force --sign - --timestamp=none "$binary"
            exit 0
          fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$binary"
          codesign --verify --strict "$binary"
          # notarytool takes an archive, and a bare binary cannot be stapled, so the ticket
          # lives with Apple and Gatekeeper asks for it when a quarantined copy is opened.
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k "$binary" "$RUNNER_TEMP/pitboard.zip"
          xcrun notarytool submit "$RUNNER_TEMP/pitboard.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"

      - name: Package
        shell: bash
        run: |
          name="pitboard-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/pitboard"
          out="$RUNNER_TEMP/dist/$name"
          mkdir -p "$out/completions"
          cp "$bin" LICENSE NOTICE README.md "$out/"
          "$bin" manpage > "$out/pitboard.1"
          for shell in bash zsh fish; do
            "$bin" completions "$shell" > "$out/completions/pitboard.$shell"
          done
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz

  # The menu bar app, signed and notarised when the Apple secrets are set; without them it
  # is still built and released, ad-hoc signed, which Gatekeeper warns about on first
  # launch. Secrets: CERTIFICATES_P12 (base64 .p12), CERTIFICATES_PASSWORD,
  # APPLE_API_KEY_P8 (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER,
  # SPARKLE_PUBLIC_KEY, SPARKLE_PRIVATE_KEY.
  app:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - id: apple
        uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}

      - name: Build
        env:
          SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./apple/scripts/build-app.sh

      # An installed copy checks the archive against the public key in the bundle it came
      # from, and takes an update whose key has changed only through the other route, which
      # needs the new bundle to satisfy the old one's designated requirement. That holds
      # for a Developer ID build and never for an ad-hoc one. So a changed key either is a
      # rotation somebody is running on purpose or strands whoever installed an ad-hoc
      # build, and no revocation reaches either. The key is compared with the one the last
      # release shipped, and a change is refused unless the repository variable
      # SPARKLE_KEY_ROTATION names this version.
      - name: The update key this release ships
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          ROTATION: ${{ vars.SPARKLE_KEY_ROTATION }}
        run: |
          plist=apple/build/Pitboard.app/Contents/Info.plist
          now=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$plist" 2>/dev/null || true)
          if [ -z "$now" ]; then
            echo "the app carries no update key: SPARKLE_PUBLIC_KEY is not set" >&2
            exit 1
          fi
          shipped=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.draft == false and .prerelease == false)
                | select([.assets[].name] | any(startswith("Pitboard-")))
                | .tag_name')
          previous=$(printf '%s\n' "$shipped" | grep -vx "$TAG" | awk 'NR == 1' || true)
          if [ -z "$previous" ]; then
            echo "no earlier release ships an app, so there is no key to compare with"
            exit 0
          fi
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Pitboard-*-macos.zip' --dir "$RUNNER_TEMP/previous"
          ditto -x -k "$RUNNER_TEMP/previous"/*.zip "$RUNNER_TEMP/previous/unpacked"
          was=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" \
            "$RUNNER_TEMP/previous/unpacked/Pitboard.app/Contents/Info.plist" 2>/dev/null || true)
          if [ -z "$was" ]; then
            echo "$previous shipped no update key, so there is nothing to compare with"
            exit 0
          fi
          if [ "$now" = "$was" ]; then
            echo "the update key is the one $previous shipped"
            exit 0
          fi
          if [ "$ROTATION" = "$VERSION" ]; then
            echo "declared rotation: $previous shipped $was, $VERSION ships $now"
            exit 0
          fi
          echo "this build's update key is $now and $previous shipped $was." >&2
          echo "An installed copy takes this only through the Apple code signing route," >&2
          echo "which an ad-hoc installed copy has not got. Read 'Rotating the update" >&2
          echo "key' in CONTRIBUTING.md, and set the repository variable" >&2
          echo "SPARKLE_KEY_ROTATION to $VERSION when this release means to." >&2
          exit 1

      - name: Notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent apple/build/Pitboard.app "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"
          # Stapled, so the app opens on a machine that cannot reach Apple.
          xcrun stapler staple apple/build/Pitboard.app

      # No `if` on the appcast. Every copy already installed reads the newest release's feed,
      # so a release that skips it strands them, and a missing key has to be a red job
      # rather than a quiet omission.
      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is not set: the feed cannot be signed" >&2
            exit 1
          fi
          out=$RUNNER_TEMP/dist
          mkdir -p "$out"
          ditto -c -k --keepParent apple/build/Pitboard.app \
            "$out/Pitboard-${GITHUB_REF_NAME}-macos.zip"
          if [ "$PRERELEASE" = "true" ]; then
            echo "a pre-release publishes no feed, so no installed copy updates into it"
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            apple/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              "$out"
          # generate_appcast cross-checks the private key it is given against the bundle's
          # SUPublicEDKey and, when they disagree, writes the feed with no signature at all
          # and exits 0. An unsigned feed is one every installed copy refuses, so the two
          # secrets disagreeing has to be found here rather than by them.
          if ! grep -q 'sparkle:edSignature="' "$out/appcast.xml"; then
            echo "the feed was written without a signature, which is what generate_appcast" >&2
            echo "does when SPARKLE_PRIVATE_KEY is not the key SPARKLE_PUBLIC_KEY names" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml

  publish:
    needs: [guard, build, app]
    runs-on: ubuntu-latest
    # Required reviewers on this environment are what stops an unexpected tag walking into
    # a crates.io upload, which is the one step of a release nobody can undo. crates.io
    # matches the environment name as well as the repository and the workflow, so a run
    # outside it cannot mint a publish token at all.
    environment: release
    permissions:
      contents: write
      # Provenance: GitHub signs a statement of which workflow, at which commit, built
      # each file, so a downloader can check it with `gh attestation verify`. The same
      # identity is what crates.io exchanges for a token, so there is no second secret.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      # A tampered download is a realistic threat for a tool that handles OAuth tokens.
      - name: Checksums
        working-directory: ${{ runner.temp }}/dist
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
      # The tap is written from this file, handed to the tap job inside this run, so the
      # checksums Homebrew checks are the ones taken here of the files this job publishes.
      # Read back from the release instead, they would be whatever the release held by then,
      # and anyone who could change the release could change a tarball and its line together.
      # Overwritten, so a publish job run again can hand it over again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: ${{ runner.temp }}/dist/SHA256SUMS
          overwrite: true

      - run: rustup toolchain install
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-cyclonedx
      # One bill of materials per artefact, read out of the lockfile, so what is inside a
      # download can be answered without the download. cargo-cyclonedx writes a file beside
      # every Cargo.toml in the workspace whatever --manifest-path says, so the one that
      # belongs to the crate in the artefact is kept and the rest deleted. A target that is
      # not installed still resolves, because the filter comes from cargo metadata and not
      # from a standard library it has to find.
      - name: Bill of materials
        run: |
          bom() {
            cargo cyclonedx --manifest-path "crates/$1/Cargo.toml" --target "$2" \
              --format json --spec-version 1.5 --all --override-filename bom
            mv "crates/$1/bom.json" "$RUNNER_TEMP/dist/$3.cdx.json"
            find crates -name bom.json -delete
          }
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bom pitboard "$target" "pitboard-${GITHUB_REF_NAME}-${target}.tar.gz"
          done
          # The app carries the core for both macOS architectures, which resolve to the
          # same dependencies, the command line, and Sparkle, which no lockfile here
          # mentions.
          bom pitboard-ffi aarch64-apple-darwin "Pitboard-${GITHUB_REF_NAME}-macos.zip"
          python3 .github/scripts/sbom-add-command-line.py \
            "$RUNNER_TEMP/dist/Pitboard-${GITHUB_REF_NAME}-macos.zip.cdx.json" \
            "$RUNNER_TEMP/dist/pitboard-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz.cdx.json"
          python3 .github/scripts/sbom-add-sparkle.py \
            "$RUNNER_TEMP/dist/Pitboard-${GITHUB_REF_NAME}-macos.zip.cdx.json" \
            apple/Package.resolved

      # crates.io gives this job a token of its own, made from GitHub's word about which
      # workflow in which repository is running, and revokes it when the job ends. There is
      # no CARGO_REGISTRY_TOKEN left to leak and nothing to rotate. What can be wrong
      # instead is the registration on crates.io, so the exchange runs on a pre-release
      # too, where finding out costs nothing.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: registry
      # First, because a crates.io upload cannot be undone and a GitHub release can. The
      # core first, then the command line that depends on it. Skipped when that version is
      # already there, so a release that failed later can simply be run again.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "crates.io returned no token; check Trusted Publishing on both crates" >&2
            exit 1
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "the token exchange works; a pre-release publishes nothing to crates.io"
            exit 0
          fi
          on_crates_io=$(curl -fsSL -A "pitboard release" \
            "https://crates.io/api/v1/crates/pitboard/$VERSION" -o /dev/null -w "%{http_code}" || true)
          if [ "$on_crates_io" = "200" ]; then
            echo "pitboard $VERSION is already on crates.io; not publishing again"
          else
            cargo publish --locked --workspace
          fi

      # SHA256SUMS is made in this job and published in the release it describes, so on its
      # own it is evidence against a download that went wrong and not against anyone who
      # could change the release. Attested, it is both.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.cdx.json
            ${{ runner.temp }}/dist/SHA256SUMS
      # The feed decides what every installed copy runs next, which makes it the most worth
      # attesting of anything here. A pre-release publishes none, so it is its own step.
      - if: needs.guard.outputs.prerelease == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/appcast.xml

      - name: What changed
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          files: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.cdx.json
            ${{ runner.temp }}/dist/appcast.xml
            ${{ runner.temp }}/dist/SHA256SUMS

  # What an installed copy will actually fetch, fetched. A release whose feed is missing,
  # stale, marked pre-release or signed with the wrong key is only visible from outside.
  #
  # The signature is checked against the public key in the bundle this release published,
  # which is the key an installed copy checks it against. It used to be checked with
  # SPARKLE_PRIVATE_KEY, which is the key that made it: the job that signed the feed was
  # the job that agreed with itself about the signature, and a wrong key passed. Nothing
  # here reads a secret any more.
  feed:
    needs: [guard, publish]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: macos-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feed=$RUNNER_TEMP/appcast.xml
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$feed" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          version=${GITHUB_REF_NAME#v}
          if ! grep -q "<sparkle:shortVersionString>$version<" "$feed"; then
            echo "the published feed does not offer $version:" >&2
            cat "$feed" >&2
            exit 1
          fi
          url=$(sed -n 's/.*enclosure url="\([^"]*\)".*/\1/p' "$feed" | head -1)
          signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$feed" | head -1)
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/update.zip" "$url"
          ditto -x -k "$RUNNER_TEMP/update.zip" "$RUNNER_TEMP/unpacked"
          key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" \
            "$RUNNER_TEMP/unpacked/Pitboard.app/Contents/Info.plist")
          swift .github/scripts/eddsa-verify.swift "$key" "$signature" "$RUNNER_TEMP/update.zip"
          spctl --assess --type execute -v "$RUNNER_TEMP/unpacked/Pitboard.app"

          # The attestation is the part of this that says who published the file, rather
          # than only that the bytes arrived whole. Sigstore takes a moment to serve one
          # that was written seconds ago.
          attested() {
            for attempt in 1 2 3 4 5; do
              gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" && return 0
              echo "no attestation for $1 yet (attempt $attempt)"
              sleep 15
            done
            return 1
          }
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/SHA256SUMS" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/SHA256SUMS"
          attested "$feed"
          attested "$RUNNER_TEMP/SHA256SUMS"
          attested "$RUNNER_TEMP/update.zip"

  # `brew install datlechin/tap/pitboard` is the first line of the README, so the tap is
  # part of a release rather than something done to it afterwards. It used to be a workflow
  # in the tap repository, waking every six hours and taking the checksum of whatever it
  # downloaded; between those two a release could be finished and green for most of a day
  # with the tap still serving the version before it, and nothing anywhere said so. The
  # checksums written here are the SHA256SUMS the publish job took of the files it
  # published, and a re-run of this job alone still reads that same file.
  #
  # The tap holds two casks and no formula: pitboard, the command line from the release's
  # tarballs, and pitboard-app, the app with the same command line inside it. Nothing in
  # either is built on the machine that installs it.
  tap:
    needs: [guard, publish]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    # HOMEBREW_TAP_TOKEN is a fine-grained token for datlechin/homebrew-tap alone, with
    # Contents read and write and nothing else. It is the only credential in this release
    # that reaches another repository, so it lives in an environment of its own and no
    # other job can read it.
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SHA256SUMS
          path: ${{ runner.temp }}/sums
      - env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap cannot be published" >&2
            exit 1
          fi

          # One line for each file the casks download. A file the release has no line for
          # is a cask nobody can install, so it stops the job before the tap is touched.
          sums=$RUNNER_TEMP/sums/SHA256SUMS
          checksum() {
            local line
            line=$(awk -v f="$1" '$2 == f { n++; sum = $1 } END { if (n == 1) print sum }' "$sums")
            if ! printf '%s\n' "$line" | grep -qxE '[0-9a-f]{64}'; then
              echo "SHA256SUMS does not have exactly one line for $1:" >&2
              cat "$sums" >&2
              return 1
            fi
            printf '%s' "$line"
          }
          arm=$(checksum "pitboard-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz")
          intel=$(checksum "pitboard-$GITHUB_REF_NAME-x86_64-apple-darwin.tar.gz")
          arm_linux=$(checksum "pitboard-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz")
          intel_linux=$(checksum "pitboard-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz")
          app=$(checksum "Pitboard-$GITHUB_REF_NAME-macos.zip")

          # A header rather than a URL, so the token is not written into a git remote. Its
          # base64 is a different string from the secret, so it is masked by hand or the
          # log would carry it unredacted.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          tap=$RUNNER_TEMP/tap
          git -c "http.extraheader=$auth" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" "$tap"

          # Each placeholder is replaced and then looked for, and a file with any left is
          # refused. A replacement that matched nothing would leave the previous release's
          # value in place, or a placeholder Homebrew cannot read, and a template and this
          # job that disagree have to stop here rather than in somebody's brew install.
          fill() { # template, destination, then placeholder=value for each placeholder
            local template=$1 out=$2 pair name value
            shift 2
            cp "$template" "$out"
            for pair in "$@"; do
              name=${pair%%=*}
              value=${pair#*=}
              if ! grep -qF "$name" "$out"; then
                echo "$template has no $name" >&2
                return 1
              fi
              sed -i "s|$name|$value|g" "$out"
              if grep -qF "$name" "$out" || ! grep -qF "\"$value\"" "$out"; then
                echo "$name was not replaced in $template" >&2
                return 1
              fi
            done
            if grep -nE '@[A-Z0-9_]+@' "$out"; then
              echo "$template has a placeholder this job does not fill" >&2
              return 1
            fi
          }
          mkdir -p "$tap/Casks"
          fill packaging/pitboard.rb "$tap/Casks/pitboard.rb" \
            "@VERSION@=$VERSION" \
            "@SHA256_AARCH64_APPLE_DARWIN@=$arm" \
            "@SHA256_X86_64_APPLE_DARWIN@=$intel" \
            "@SHA256_AARCH64_UNKNOWN_LINUX_MUSL@=$arm_linux" \
            "@SHA256_X86_64_UNKNOWN_LINUX_MUSL@=$intel_linux"
          fill packaging/pitboard-app.rb "$tap/Casks/pitboard-app.rb" \
            "@VERSION@=$VERSION" \
            "@SHA256_APP@=$app"
          # The formula built from source and is gone. The migration points whoever still
          # has it at the cask of the same name.
          cp packaging/tap_migrations.json "$tap/tap_migrations.json"
          rm -f "$tap/Formula/pitboard.rb"

          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "the tap already serves $VERSION"
            exit 0
          fi
          git commit -m "pitboard $VERSION"
          git -c "http.extraheader=$auth" push

  # What somebody following the README gets, got, on machines with nothing of this
  # repository on them: the command line on macOS and Linux, then on macOS the app, whose
  # copy of the command line is the one on PATH once it is installed.
  brew:
    needs: [guard, tap]
    if: needs.guard.outputs.prerelease == 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The Linux runners come with Homebrew and leave it off PATH.
      - if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Install the way the README says to
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          cask_version() {
            brew info --json=v2 --cask datlechin/tap/pitboard |
              python3 -c "import json,sys; print(json.load(sys.stdin)['casks'][0]['version'])"
          }
          # The push and this clone are two machines talking to GitHub, so the tap is given
          # a couple of minutes to be servable before it is called stale.
          cask=
          for attempt in $(seq 1 12); do
            brew untap datlechin/tap 2>/dev/null || true
            brew tap datlechin/tap
            cask=$(cask_version)
            [ "$cask" = "$VERSION" ] && break
            echo "the tap serves $cask, waiting for $VERSION (attempt $attempt)"
            sleep 10
          done
          if [ "$cask" != "$VERSION" ]; then
            echo "this release published $VERSION and the tap serves $cask" >&2
            exit 1
          fi
          brew install datlechin/tap/pitboard

      - name: What it installed
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          pitboard --version
          pitboard --version | grep -qw "$VERSION"
          # doctor exits 3 where Claude Code has never run, which is every clean runner, so
          # what is checked here is that the installed binary runs its checks at all.
          exit=0
          pitboard doctor || exit=$?
          case $exit in
            0 | 3) ;;
            *)
              echo "pitboard doctor exited $exit" >&2
              exit 1
              ;;
          esac
          # The man page and the completions, where man and the shells look for them.
          prefix=$(brew --prefix)
          for file in share/man/man1/pitboard.1 etc/bash_completion.d/pitboard \
            share/zsh/site-functions/_pitboard share/fish/vendor_completions.d/pitboard.fish; do
            if [ ! -s "$prefix/$file" ]; then
              echo "the cask left nothing at $prefix/$file" >&2
              exit 1
            fi
          done
          if ! grep -qF "\"pitboard $VERSION\"" "$prefix/share/man/man1/pitboard.1"; then
            echo "the man page is not the one for $VERSION" >&2
            exit 1
          fi

      # The two casks both put pitboard on PATH, so they conflict, and the command line goes
      # before the app comes.
      - if: runner.os == 'macOS'
        name: The app, and the command line inside it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          brew uninstall --cask datlechin/tap/pitboard
          brew install --cask datlechin/tap/pitboard-app
          app=
          for candidate in /Applications "$HOME/Applications"; do
            [ -d "$candidate/Pitboard.app" ] && app=$candidate/Pitboard.app && break
          done
          if [ -z "$app" ]; then
            echo "the cask installed no Pitboard.app" >&2
            exit 1
          fi
          installed=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$app/Contents/Info.plist")
          if [ "$installed" != "$VERSION" ]; then
            echo "the cask says $VERSION and installed $installed" >&2
            exit 1
          fi
          # The copy inside the bundle is the one Sparkle updates, so PATH has to lead to it
          # and not to a copy of its own.
          prefix=$(brew --prefix)
          app=$(realpath "$app")
          linked=$(realpath "$prefix/bin/pitboard")
          if [ "$linked" != "$app/Contents/Helpers/pitboard" ]; then
            echo "pitboard on PATH is $linked, not the app's own" >&2
            exit 1
          fi
          "$prefix/bin/pitboard" --version
          "$prefix/bin/pitboard" --version | grep -qw "$VERSION"
          for file in share/man/man1/pitboard.1 etc/bash_completion.d/pitboard \
            share/zsh/site-functions/_pitboard share/fish/vendor_completions.d/pitboard.fish; do
            case $(realpath "$prefix/$file") in
              "$app/Contents/Resources/"*) ;;
              *)
                echo "$prefix/$file does not lead into the app" >&2
                exit 1
                ;;
            esac
          done
