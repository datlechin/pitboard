name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Static, so one binary runs on every distribution whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      # ring compiles C, and needs a compiler that targets musl.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p pitboard --target ${{ matrix.target }}

      # Only a Developer ID certificate can be notarised. Without one, an ad-hoc signature
      # is what Apple Silicon requires to run a binary at all; Gatekeeper will still warn on
      # first launch of a downloaded copy, which is why `cargo install` is the primary route.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - --timestamp=none target/${{ matrix.target }}/release/pitboard

      - name: Package
        shell: bash
        run: |
          name="pitboard-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/pitboard"
          out="$RUNNER_TEMP/dist/$name"
          mkdir -p "$out/completions"
          cp "$bin" LICENSE NOTICE README.md "$out/"
          "$bin" manpage > "$out/pitboard.1"
          for shell in bash zsh fish; do
            "$bin" completions "$shell" > "$out/completions/pitboard.$shell"
          done
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      # A tampered download is a realistic threat for a tool that handles OAuth tokens.
      - run: sha256sum -- *.tar.gz > SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
      - run: rustup toolchain install
      # First, because a crates.io upload cannot be undone and a GitHub release can.
      # The core first, then the command line that depends on it.
      - run: cargo publish --locked --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/SHA256SUMS
