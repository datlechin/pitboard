name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything irreversible waits behind this: publishing to crates.io cannot be undone, and
  # an installed copy reads whatever feed the release publishes. A tag that disagrees with
  # the manifest or has nothing written about it is a mistake, not a release.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          version=${GITHUB_REF_NAME#v}
          # A tag like v0.2.0-rc1 is a release for a few people: a GitHub pre-release, no
          # crates.io upload, and no appcast, so nobody's copy updates itself into it.
          case "$version" in
            *-*) prerelease=true; base=${version%%-*} ;;
            *)   prerelease=false; base=$version ;;
          esac
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$base" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml's $manifest" >&2
            exit 1
          fi
          if [ "$prerelease" = false ] && ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Static, so one binary runs on every distribution whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      # ring compiles C, and needs a compiler that targets musl.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p pitboard --target ${{ matrix.target }}

      # Signed and notarised like the app, so a tarball opened from a browser, which
      # arrives quarantined, is not stopped by Gatekeeper. Without a certificate an ad-hoc
      # signature is what Apple Silicon needs to run a binary at all.
      - if: runner.os == 'macOS'
        id: apple
        uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}
      - if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ steps.apple.outputs.identity }}
          SIGNED: ${{ steps.apple.outputs.signed }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          binary=target/${{ matrix.target }}/release/pitboard
          if [ "$SIGNED" != "true" ]; then
            codesign --force --sign - --timestamp=none "$binary"
            exit 0
          fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$binary"
          codesign --verify --strict "$binary"
          # notarytool takes an archive, and a bare binary cannot be stapled, so the ticket
          # lives with Apple and Gatekeeper asks for it when a quarantined copy is opened.
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k "$binary" "$RUNNER_TEMP/pitboard.zip"
          xcrun notarytool submit "$RUNNER_TEMP/pitboard.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"

      - name: Package
        shell: bash
        run: |
          name="pitboard-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/pitboard"
          out="$RUNNER_TEMP/dist/$name"
          mkdir -p "$out/completions"
          cp "$bin" LICENSE NOTICE README.md "$out/"
          "$bin" manpage > "$out/pitboard.1"
          for shell in bash zsh fish; do
            "$bin" completions "$shell" > "$out/completions/pitboard.$shell"
          done
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz

  # The menu bar app, signed and notarised when the Apple secrets are set; without them it
  # is still built and released, ad-hoc signed, which Gatekeeper warns about on first
  # launch. Secrets: CERTIFICATES_P12 (base64 .p12), CERTIFICATES_PASSWORD,
  # APPLE_API_KEY_P8 (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER,
  # SPARKLE_PUBLIC_KEY, SPARKLE_PRIVATE_KEY.
  app:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - id: apple
        uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}

      - name: Build
        env:
          SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./apple/scripts/build-app.sh

      - name: Notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent apple/build/Pitboard.app "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"
          # Stapled, so the app opens on a machine that cannot reach Apple.
          xcrun stapler staple apple/build/Pitboard.app

      # No `if` on the appcast. Every copy already installed reads the newest release's feed,
      # so a release that skips it strands them, and a missing key has to be a red job
      # rather than a quiet omission.
      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is not set: the feed cannot be signed" >&2
            exit 1
          fi
          out=$RUNNER_TEMP/dist
          mkdir -p "$out"
          ditto -c -k --keepParent apple/build/Pitboard.app \
            "$out/Pitboard-${GITHUB_REF_NAME}-macos.zip"
          if [ "$PRERELEASE" = "true" ]; then
            echo "a pre-release publishes no feed, so no installed copy updates into it"
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            apple/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml

  publish:
    needs: [guard, build, app]
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.sums.outputs.source }}
      app: ${{ steps.sums.outputs.app }}
    permissions:
      contents: write
      # Provenance: GitHub signs a statement of which workflow, at which commit, built
      # each file, so a downloader can check it with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      # What the Homebrew formula builds from. GitHub makes an archive of a tag on demand
      # and has changed the bytes it makes before now, so the tarball is a file of this
      # release instead: its checksum is settled the moment it is taken, it is in
      # SHA256SUMS with everything else, and it is attested.
      - name: The source, as a file of this release
        run: |
          git archive --format=tar.gz --prefix="pitboard-${GITHUB_REF_NAME#v}/" \
            -o "$RUNNER_TEMP/dist/pitboard-${GITHUB_REF_NAME}-source.tar.gz" HEAD

      # A tampered download is a realistic threat for a tool that handles OAuth tokens.
      # These two lines are also what the tap is written from, so the checksum Homebrew
      # checks is the one this release took of the file it published, not one taken later
      # somewhere else.
      - id: sums
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          source=$(awk -v f="pitboard-${GITHUB_REF_NAME}-source.tar.gz" '$2 == f {print $1}' SHA256SUMS)
          app=$(awk -v f="Pitboard-${GITHUB_REF_NAME}-macos.zip" '$2 == f {print $1}' SHA256SUMS)
          if [ -z "$source" ] || [ -z "$app" ]; then
            echo "SHA256SUMS has no line for the source tarball or for the app:" >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - run: rustup toolchain install
      # First, because a crates.io upload cannot be undone and a GitHub release can. The
      # core first, then the command line that depends on it. Skipped when that version is
      # already there, so a release that failed later can simply be run again.
      - if: needs.guard.outputs.prerelease == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          on_crates_io=$(curl -fsSL -A "pitboard release" \
            "https://crates.io/api/v1/crates/pitboard/$VERSION" -o /dev/null -w "%{http_code}" || true)
          if [ "$on_crates_io" = "200" ]; then
            echo "pitboard $VERSION is already on crates.io; not publishing again"
          else
            cargo publish --locked --workspace
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
      - name: What changed
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          files: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml
            ${{ runner.temp }}/dist/SHA256SUMS

  # What an installed copy will actually fetch, fetched. A release whose feed is missing,
  # stale, marked pre-release or signed with the wrong key is only visible from outside.
  feed:
    needs: [guard, publish]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sparkle's own distribution, at the version the package resolved to. Resolving the
      # package here instead would mean building the core first, for one small tool.
      - run: |
          version=$(python3 -c "import json;print([p for p in json.load(open('apple/Package.resolved'))['pins'] if p['identity']=='sparkle'][0]['state']['version'])")
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$version/Sparkle-$version.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP" bin/sign_update
      - env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          feed=$RUNNER_TEMP/appcast.xml
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$feed" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          version=${GITHUB_REF_NAME#v}
          if ! grep -q "<sparkle:shortVersionString>$version<" "$feed"; then
            echo "the published feed does not offer $version:" >&2
            cat "$feed" >&2
            exit 1
          fi
          url=$(sed -n 's/.*enclosure url="\([^"]*\)".*/\1/p' "$feed" | head -1)
          signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$feed" | head -1)
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/update.zip" "$url"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/bin/sign_update" \
              --verify "$RUNNER_TEMP/update.zip" "$signature" --ed-key-file -
          ditto -x -k "$RUNNER_TEMP/update.zip" "$RUNNER_TEMP/unpacked"
          spctl --assess --type execute -v "$RUNNER_TEMP/unpacked/Pitboard.app"

  # `brew install datlechin/tap/pitboard` is the first line of the README, so the tap is
  # part of a release rather than something done to it afterwards. It used to be a workflow
  # in the tap repository, waking every six hours and taking the checksum of whatever it
  # downloaded; between those two a release could be finished and green for most of a day
  # with the tap still serving the version before it, and nothing anywhere said so. The two
  # checksums written here are the lines the release put in SHA256SUMS, over the files it
  # published itself.
  tap:
    needs: [guard, publish]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    # HOMEBREW_TAP_TOKEN is a fine-grained token for datlechin/homebrew-tap alone, with
    # Contents read and write and nothing else. It is the only credential in this release
    # that reaches another repository, so it lives in an environment of its own and no
    # other job can read it.
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
          SOURCE_SHA: ${{ needs.publish.outputs.source }}
          APP_SHA: ${{ needs.publish.outputs.app }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap cannot be published" >&2
            exit 1
          fi
          # A header rather than a URL, so the token is not written into a git remote. Its
          # base64 is a different string from the secret, so it is masked by hand or the
          # log would carry it unredacted.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          tap=$RUNNER_TEMP/tap
          git -c "http.extraheader=$auth" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" "$tap"

          # The version and the checksum are the only two things that move, and a sed that
          # matched nothing would leave the previous release's in place, which is the
          # failure this job exists to end.
          rewrite() {
            sed -e "s|^  version \".*\"|  version \"$VERSION\"|" \
                -e "s|^  sha256 \".*\"|  sha256 \"$2\"|" "$1" > "$3"
            grep -q "^  version \"$VERSION\"$" "$3"
            grep -q "^  sha256 \"$2\"$" "$3"
          }
          mkdir -p "$tap/Formula" "$tap/Casks"
          rewrite packaging/pitboard.rb "$SOURCE_SHA" "$tap/Formula/pitboard.rb"
          rewrite packaging/pitboard-cask.rb "$APP_SHA" "$tap/Casks/pitboard.rb"

          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "the tap already serves $VERSION"
            exit 0
          fi
          git commit -m "pitboard $VERSION"
          git -c "http.extraheader=$auth" push

  # What somebody following the README gets, got, on a machine with nothing of this
  # repository on it. The cask depends on the formula, so a tap that moved one and not the
  # other installs an old command line beside a new app and says nothing about it.
  brew:
    needs: [guard, tap]
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: macos-latest
    steps:
      - name: Install the way the README says to
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          cask_version() {
            brew info --json=v2 --cask datlechin/tap/pitboard |
              python3 -c "import json,sys; print(json.load(sys.stdin)['casks'][0]['version'])"
          }
          formula_version() {
            brew info --json=v2 --formula datlechin/tap/pitboard |
              python3 -c "import json,sys; print(json.load(sys.stdin)['formulae'][0]['versions']['stable'])"
          }
          # The push and this clone are two machines talking to GitHub, so the tap is given
          # a couple of minutes to be servable before it is called stale.
          cask=
          for attempt in $(seq 1 12); do
            brew untap datlechin/tap 2>/dev/null || true
            brew tap datlechin/tap
            cask=$(cask_version)
            [ "$cask" = "$VERSION" ] && break
            echo "the tap serves $cask, waiting for $VERSION (attempt $attempt)"
            sleep 10
          done
          if [ "$cask" != "$VERSION" ]; then
            echo "this release published $VERSION and the tap serves $cask" >&2
            exit 1
          fi
          formula=$(formula_version)
          if [ "$formula" != "$VERSION" ]; then
            echo "the tap's formula is $formula and its cask is $cask" >&2
            exit 1
          fi
          brew install --formula datlechin/tap/pitboard
          brew install --cask datlechin/tap/pitboard

      - name: What it installed
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          pitboard --version
          pitboard --version | grep -qw "$VERSION"
          # doctor exits 3 where Claude Code has never run, which is every clean runner, so
          # what is checked here is that the installed binary runs its checks at all.
          exit=0
          pitboard doctor || exit=$?
          case $exit in
            0 | 3) ;;
            *)
              echo "pitboard doctor exited $exit" >&2
              exit 1
              ;;
          esac
          app=
          for candidate in /Applications "$HOME/Applications"; do
            [ -d "$candidate/Pitboard.app" ] && app=$candidate/Pitboard.app && break
          done
          if [ -z "$app" ]; then
            echo "the cask installed no Pitboard.app" >&2
            exit 1
          fi
          installed=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$app/Contents/Info.plist")
          if [ "$installed" != "$VERSION" ]; then
            echo "the cask says $VERSION and installed $installed" >&2
            exit 1
          fi
