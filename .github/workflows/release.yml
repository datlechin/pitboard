name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Static, so one binary runs on every distribution whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      # ring compiles C, and needs a compiler that targets musl.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked -p pitboard --target ${{ matrix.target }}

      # Only a Developer ID certificate can be notarised. Without one, an ad-hoc signature
      # is what Apple Silicon requires to run a binary at all; Gatekeeper will still warn on
      # first launch of a downloaded copy, which is why `cargo install` is the primary route.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - --timestamp=none target/${{ matrix.target }}/release/pitboard

      - name: Package
        shell: bash
        run: |
          name="pitboard-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/pitboard"
          out="$RUNNER_TEMP/dist/$name"
          mkdir -p "$out/completions"
          cp "$bin" LICENSE NOTICE README.md "$out/"
          "$bin" manpage > "$out/pitboard.1"
          for shell in bash zsh fish; do
            "$bin" completions "$shell" > "$out/completions/pitboard.$shell"
          done
          tar -C "$RUNNER_TEMP/dist" -czf "$RUNNER_TEMP/dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz

  # The menu bar app, signed and notarised when the Apple secrets are set; without them it
  # is still built and released, ad-hoc signed, which Gatekeeper warns about on first
  # launch. Secrets: CERTIFICATES_P12 (base64 .p12), CERTIFICATES_PASSWORD,
  # APPLE_API_KEY_P8 (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER,
  # SPARKLE_PUBLIC_KEY, SPARKLE_PRIVATE_KEY.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Take the signing certificate
        id: apple
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "no Developer ID certificate: building ad-hoc, without notarisation" >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A keychain of this job's own, unlocked, and left unlocked for six hours so a
          # long notarisation cannot relock it mid-run. The runner is thrown away after.
          keychain=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain
          # The certificate says who it is, so the identity is read rather than configured.
          identity=$(security find-identity -v -p codesigning |
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "that certificate is not a Developer ID Application one" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./apple/scripts/build-app.sh

      - name: Notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent apple/build/Pitboard.app "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"
          # Stapled, so the app opens on a machine that cannot reach Apple.
          xcrun stapler staple apple/build/Pitboard.app

      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          out=$RUNNER_TEMP/dist
          mkdir -p "$out"
          ditto -c -k --keepParent apple/build/Pitboard.app \
            "$out/Pitboard-${GITHUB_REF_NAME}-macos.zip"
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            printf '%s' "$SPARKLE_PRIVATE_KEY" | \
              apple/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
                --ed-key-file - \
                --download-url-prefix \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
                --link "https://github.com/${GITHUB_REPOSITORY}" \
                "$out"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml

  publish:
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      # A tampered download is a realistic threat for a tool that handles OAuth tokens.
      - run: sha256sum -- *.tar.gz *.zip > SHA256SUMS
        working-directory: ${{ runner.temp }}/dist
      - run: rustup toolchain install
      # First, because a crates.io upload cannot be undone and a GitHub release can.
      # The core first, then the command line that depends on it.
      - run: cargo publish --locked --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml
            ${{ runner.temp }}/dist/SHA256SUMS
