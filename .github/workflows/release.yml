name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      # Only a Developer ID certificate can be notarised. Without one, an ad-hoc signature
      # is what Apple Silicon requires to run a binary at all; Gatekeeper will still warn on
      # first launch of a downloaded copy, which is why `cargo install` is the primary route.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - --timestamp=none target/${{ matrix.target }}/release/pitboard

      - name: Package
        shell: bash
        run: |
          name="pitboard-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/pitboard"
          mkdir -p "dist/$name/completions"
          cp "$bin" LICENSE NOTICE README.md "dist/$name/"
          "$bin" manpage > "dist/$name/pitboard.1"
          for shell in bash zsh fish; do
            "$bin" completions "$shell" > "dist/$name/completions/pitboard.$shell"
          done
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A tampered download is a realistic threat for a tool that handles OAuth tokens.
      - run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
