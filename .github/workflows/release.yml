name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so two tags never push the tap at once. A running release is never
# cancelled: a tag pushed meanwhile waits, and a third replaces the one waiting.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything irreversible waits behind this: publishing to crates.io cannot be undone, and
  # an installed copy reads whatever feed the release publishes. A tag that disagrees with
  # the manifest or has nothing written about it is a mistake, not a release.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      kind: ${{ steps.check.outputs.kind }}
      base: ${{ steps.check.outputs.base }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      windows: ${{ steps.check.outputs.windows }}
      crates: ${{ steps.check.outputs.crates }}
      latest: ${{ steps.check.outputs.latest }}
      signed: ${{ steps.check.outputs.signed }}
      linux: ${{ steps.linux.outputs.linux }}
      linux-suites: ${{ steps.linux.outputs.suites }}
      core: ${{ steps.core.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER: ${{ vars.WINDOWS_SIGNER }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$RUNNER_TEMP/published"
          sh .github/scripts/release-kind.sh "$GITHUB_REF_NAME" "$manifest" \
            "$RUNNER_TEMP/published" "$SIGNER" "$SUBJECT" > "$RUNNER_TEMP/kind"
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/kind")
          kind=$(sed -n 's/^kind=//p' "$RUNNER_TEMP/kind")
          # An rc has no section of its own.
          if [ "$kind" != rc ] && ! awk -v heading="## [$version] - " \
            'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/kind" >> "$GITHUB_OUTPUT"
      # The Linux packages wait for a Linux session's record, and once a release has shipped them
      # every later one must, or the repository would stop following.
      - id: linux
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          KIND: ${{ steps.check.outputs.kind }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]
            | select(.draft == false)
            | "\(.tag_name) \(.prerelease) \([.assets[].name] | any(endswith(".deb")))"' \
            > "$RUNNER_TEMP/releases"
          sh .github/scripts/linux-release.sh "$VERSION" "$KIND" "$LATEST" \
            docs/facts/linux-session.md "$RUNNER_TEMP/releases" > "$RUNNER_TEMP/linux"
          cat "$RUNNER_TEMP/linux" >> "$GITHUB_OUTPUT"
          # What the release signs, the repository's subkey must outlast by 180 days.
          if grep -qx linux=true "$RUNNER_TEMP/linux"; then
            sh .github/scripts/linux-repository-key.sh packaging/linux/pitboard-archive-keyring.asc \
              "$(date -u +%s)"
          fi
      - id: core
        run: |
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/pitboard-core/Cargo.toml | head -1)
          on_crates_io=$(curl -fsSL -A "pitboard release" -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/pitboard-core/$core" || true)
          case $on_crates_io in
            200)
              curl -fsSL -A "pitboard release" -o "$RUNNER_TEMP/core.crate" \
                "https://static.crates.io/crates/pitboard-core/pitboard-core-$core.crate"
              rustup toolchain install
              cargo package -p pitboard-core --no-verify --locked
              sh .github/scripts/core-unchanged.sh "$RUNNER_TEMP/core.crate" \
                "target/package/pitboard-core-$core.crate"
              ;;
            404) ;;
            *)
              echo "crates.io answered $on_crates_io for pitboard-core $core" >&2
              exit 1
              ;;
          esac
          echo "core=$core" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Static, so one binary runs on every distribution whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      # ring compiles C, and needs a compiler that targets musl.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"

      # The SDK's SQLite, not Homebrew's, which a Mac may lack. libsqlite3-sys asks pkg-config
      # even where SQLITE3_LIB_DIR is set, unless SQLITE3_NO_PKG_CONFIG is set too. The otool
      # check below stops a build that links another all the same.
      - if: runner.os == 'macOS'
        run: |
          echo "SQLITE3_LIB_DIR=$(xcrun --show-sdk-path)/usr/lib" >> "$GITHUB_ENV"
          echo "SQLITE3_NO_PKG_CONFIG=1" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p pitboard --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: |
          linked=$(otool -L "target/${{ matrix.target }}/release/pitboard" |
            awk 'tolower($1) ~ /sqlite/ {print $1}')
          if [ "$linked" != /usr/lib/libsqlite3.dylib ]; then
            echo "pitboard links a sqlite other than the system's: $linked" >&2
            exit 1
          fi
      # What only a build for tests reads is in no binary that ships.
      - run: |
          if LC_ALL=C grep -a -q 'PITBOARD_TEST_CLAUDE_DESKTOP' \
            "target/${{ matrix.target }}/release/pitboard"; then
            echo "pitboard holds a variable only a build for tests reads" >&2
            exit 1
          fi

      # Signed and notarised like the app, so a tarball opened from a browser, which
      # arrives quarantined, is not stopped by Gatekeeper. Without a certificate an ad-hoc
      # signature is what Apple Silicon needs to run a binary at all.
      - if: runner.os == 'macOS'
        id: apple
        uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}
      - if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ steps.apple.outputs.identity }}
          SIGNED: ${{ steps.apple.outputs.signed }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          binary=target/${{ matrix.target }}/release/pitboard
          if [ "$SIGNED" != "true" ]; then
            codesign --force --sign - --timestamp=none "$binary"
            exit 0
          fi
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$binary"
          codesign --verify --strict "$binary"
          # notarytool takes an archive, and a bare binary cannot be stapled, so the ticket
          # lives with Apple and Gatekeeper asks for it when a quarantined copy is opened.
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k "$binary" "$RUNNER_TEMP/pitboard.zip"
          xcrun notarytool submit "$RUNNER_TEMP/pitboard.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"

      - name: Package
        run: >
          sh .github/scripts/pack-command-line.sh "target/${{ matrix.target }}/release/pitboard"
          "pitboard-${GITHUB_REF_NAME}-${{ matrix.target }}" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*.tar.gz

  # The command line for Windows, from 1.0.0, each zip built and checked on the machine it is
  # for, by the action CI builds every pull request's with.
  build-windows:
    needs: guard
    if: needs.guard.outputs.windows == 'true'
    strategy:
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release
        with:
          triple: ${{ matrix.triple }}
          version: ${{ needs.guard.outputs.version }}
      # Not dist-, so publish never takes it: only windows-sign hands a Windows zip on.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.triple }}
          path: ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error

  # The Windows app from 1.0.0, each architecture built on its own machine as CI's windows-app job
  # builds its Release: both libraries as a release ships them, their bindings, Pitboard.exe and,
  # once a signer is set, PitboardShare.exe and its sparse package. An unsigned build ships no
  # sparse package, since only a signature the machine trusts registers one. Pitboard's own
  # programs and the package go to the signer; the .NET runtime's and the Windows App SDK's go on
  # as Microsoft signed them, the Windows Community Toolkit's as the .NET Foundation did, and
  # WinSparkle.dll unsigned, as NuGet's WinSparkle 0.9.4 holds it.
  # No cache here, as in build-windows.
  app-windows-build:
    needs: guard
    if: needs.guard.outputs.windows == 'true'
    strategy:
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            runtime: win-x64
            platform: x64
            installer: x64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            runtime: win-arm64
            platform: ARM64
            installer: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # The static C runtime and no cfg: the release gate is what the version's major makes it.
      RUSTFLAGS: -C target-feature=+crt-static
      PITBOARD_REQUIRE_VERSIONINFO: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - id: numbers
        env:
          BASE: ${{ needs.guard.outputs.base }}
        run: sh .github/scripts/windows-versions.sh "$BASE" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/windows-app-libraries
        with:
          triple: ${{ matrix.triple }}
      # MSBuild reads WINDOWS_UPDATE_PUBLIC_KEY and WINDOWS_SIGNER_SUBJECT from the environment.
      - name: Pitboard.exe, and PitboardShare.exe once a signer is set
        working-directory: apps/windows
        env:
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          BASE: ${{ needs.guard.outputs.base }}
          FILE_VERSION: ${{ steps.numbers.outputs.file }}
          SIGNED: ${{ needs.guard.outputs.signed }}
          WINDOWS_UPDATE_PUBLIC_KEY: ${{ secrets.WINDOWS_UPDATE_PUBLIC_KEY }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          out="$RUNNER_TEMP/app"
          dotnet publish Pitboard.App -c Release -r "$RUNTIME" -p:Platform="$PLATFORM" -o "$out" \
            -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" \
            -p:Version="$BASE" -p:FileVersion="$FILE_VERSION"
          if [ "$SIGNED" = true ]; then
            dotnet publish Pitboard.Share -c Release -r "$RUNTIME" -o "$out" -p:Version="$BASE" \
              -p:FileVersion="$FILE_VERSION" \
              -p:PitboardShareNativeLibrary="$GITHUB_WORKSPACE/target/release/pitboard_share_ffi.dll"
          fi
          cmp "$GITHUB_WORKSPACE/target/release/pitboard_ffi.dll" "$out/pitboard_ffi.dll"
      - name: PitboardShare's sparse package, published by the signer's subject
        if: needs.guard.outputs.signed == 'true'
        shell: pwsh
        env:
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
          PACKAGE_VERSION: ${{ steps.numbers.outputs.package }}
        run: >
          ./.github/scripts/pack-windows-share.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'app')
          -Publisher $env:SUBJECT -Version $env:PACKAGE_VERSION
      # In the environment the libraries were built in.
      - name: "The Release build: no fixture, no cfg and no feature for tests, identity on PitboardShare.exe alone, the signer's Publisher, the update key, the feed, one version"
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          BASE: ${{ needs.guard.outputs.base }}
          FILE_VERSION: ${{ steps.numbers.outputs.file }}
          KEY: ${{ secrets.WINDOWS_UPDATE_PUBLIC_KEY }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: >
          ./.github/scripts/check-windows-app.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'app') -Triple $env:TRIPLE
          -GatedLibrary target/release/pitboard_ffi.dll -Signer $env:SUBJECT -UpdateKey $env:KEY
          -Version $env:BASE -FileVersion $env:FILE_VERSION
      - name: Pitboard's own programs, and its package, for the signer
        shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'app'
          $ours = Join-Path $env:RUNNER_TEMP 'ours'
          $files = @(Get-ChildItem -LiteralPath $app -Recurse -File |
            Where-Object { $_.Name -like 'pitboard*' -and $_.Extension -in '.exe', '.dll', '.msix' })
          foreach ($file in $files) {
            $to = Join-Path $ours ([IO.Path]::GetRelativePath($app, $file.FullName))
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $to) | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $to
          }
          Write-Output "For the signer: $($files.Name -join ', ')"
      # Not dist-, so publish never takes them: only windows-sign hands Pitboard's programs on.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app-${{ matrix.installer }}
          path: ${{ runner.temp }}/ours
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-windows-${{ matrix.installer }}
          path: ${{ runner.temp }}/app
          if-no-files-found: error
      # After the uploads, so the tool cannot touch what goes to the signer.
      - name: The .NET packages' bill of materials
        shell: pwsh
        working-directory: apps/windows
        env:
          RUNTIME: ${{ matrix.runtime }}
          BASE: ${{ needs.guard.outputs.base }}
          SIGNED: ${{ needs.guard.outputs.signed }}
        run: |
          # The package nuget.org lists for CycloneDX 6.3.1, by its SHA-512, installed from a source that holds it alone.
          $source = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'cyclonedx')).FullName
          $package = Join-Path $source 'cyclonedx.6.3.1.nupkg'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/cyclonedx/6.3.1/cyclonedx.6.3.1.nupkg' -OutFile $package `
            -MaximumRetryCount 5 -RetryIntervalSec 10
          $pinned = 'C69D4CB77B444007528ADA15C14DC57F7F873C3E81CDF08DB790C164CD7A26AB6FDA63790AC80BE397DF044DC67EDF4E64722F61D9ABBEC40ED2138ED7023BC9'
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA512).Hash -ne $pinned) { throw 'cyclonedx.6.3.1.nupkg is not the one read on 16 October 2026' }
          $config = Join-Path $env:RUNNER_TEMP 'cyclonedx.config'
          Set-Content -LiteralPath $config -Value "<configuration><packageSources><clear /><add key=`"pinned`" value=`"$source`" /></packageSources></configuration>"
          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          dotnet tool install --tool-path $tools CycloneDX --version 6.3.1 --configfile $config
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install exited $LASTEXITCODE" }
          $projects = [ordered]@{ 'dotnet-app.cdx.json' = 'Pitboard.App/Pitboard.App.csproj', 'Pitboard' }
          if ($env:SIGNED -eq 'true') { $projects['dotnet-share.cdx.json'] = 'Pitboard.Share/Pitboard.Share.csproj', 'PitboardShare' }
          foreach ($name in $projects.Keys) {
            $project, $component = $projects[$name]
            & (Join-Path $tools 'dotnet-CycloneDX') $project -rs -dpr -tfm net10.0-windows10.0.26100.0 -rt $env:RUNTIME `
              -o (Join-Path $env:RUNNER_TEMP 'bom') -fn $name -F Json -spv 1.5 -sn $component -sv $env:BASE
            if ($LASTEXITCODE -ne 0) { throw "dotnet-CycloneDX $project exited $LASTEXITCODE" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bom-windows-${{ matrix.installer }}
          path: ${{ runner.temp }}/bom
          if-no-files-found: error

  # Every Windows zip and every program of the app reaches publish or the MSI through here, checked:
  # each signed by the signer's subject when the guard says signed, and none signed when it does not,
  # all in one request. No cache here or in the builds: SignPath's origin verification refuses a
  # build that may take another's files.
  windows-sign:
    needs: [guard, build-windows, app-windows-build]
    if: needs.guard.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    # Takes deployments from v* tags only, and holds the signer's credentials.
    environment: windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*-pc-windows-msvc
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
      # A folder for each architecture's, whose files have the same names.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-app-*
          path: ${{ runner.temp }}/unsigned-app
      - name: Sign
        shell: pwsh
        env:
          SIGNED: ${{ needs.guard.outputs.signed }}
          SIGNER: ${{ vars.WINDOWS_SIGNER }}
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          if ($env:SIGNED -ne 'true') {
            Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'unsigned\*.zip') -Destination $dist
            Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'unsigned-app') -Destination (Join-Path $env:RUNNER_TEMP 'signed-app') -Recurse
            Write-Output 'No signer is set, so this beta ships its Windows zips and app unsigned.'
            exit 0
          }
          throw "no signing step for $env:SIGNER"
      - name: Every signature
        shell: pwsh
        env:
          SIGNED: ${{ needs.guard.outputs.signed }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $mode = if ($env:SIGNED -eq 'true') { 'signed' } else { 'unsigned' }
          $zips = @(Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'dist\*.zip') | ForEach-Object FullName)
          if ($zips.Count -ne 2) { throw "windows-sign has $($zips.Count) zips to hand on, not 2" }
          ./.github/scripts/verify-windows-signatures.ps1 -Path $zips -Mode $mode -Subject $env:SUBJECT `
            -Built (Join-Path $env:RUNNER_TEMP 'unsigned')
          $before = Join-Path $env:RUNNER_TEMP 'unsigned-app'
          $after = Join-Path $env:RUNNER_TEMP 'signed-app'
          $relative = { param($Folder) @(Get-ChildItem -LiteralPath $Folder -Recurse -File | ForEach-Object { [IO.Path]::GetRelativePath($Folder, $_.FullName) } | Sort-Object) }
          $built = & $relative $before
          $signed = & $relative $after
          if (($signed -join ', ') -ne ($built -join ', ')) { throw "the signer handed back $($signed -join ', '), not $($built -join ', ')" }
          ./.github/scripts/verify-windows-signatures.ps1 -Path ($signed | ForEach-Object { Join-Path $after $_ }) -Mode $mode -Subject $env:SUBJECT
      # Overwritten, so a windows-sign job run again can hand both over again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/dist/*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-aarch64-pc-windows-msvc
          path: ${{ runner.temp }}/dist/*-aarch64-pc-windows-msvc.zip
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app-x64
          path: ${{ runner.temp }}/signed-app/unsigned-app-x64
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app-arm64
          path: ${{ runner.temp }}/signed-app/unsigned-app-arm64
          if-no-files-found: error
          overwrite: true

  # Each architecture's MSI, from the files windows-sign signed and the pitboard.exe of its signed
  # zip, so the zip and the MSI carry one build. WiX v7 builds it and runs ICE validation,
  # validate-windows-msi.ps1 runs ICE03, msiexec /a extracts it without installing anything, and it
  # is checked as CI checks the MSI it builds on every pull request. No runner installs a release's
  # MSI.
  app-windows-package:
    needs: [guard, app-windows-build, windows-sign]
    if: needs.guard.outputs.windows == 'true'
    strategy:
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            installer: x64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            installer: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-windows-app.ps1 reads the libraries' features with cargo tree.
      - uses: ./.github/actions/rust
        with:
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - id: numbers
        shell: bash
        env:
          BASE: ${{ needs.guard.outputs.base }}
        run: sh .github/scripts/windows-versions.sh "$BASE" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-windows-${{ matrix.installer }}
          path: ${{ runner.temp }}/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-app-${{ matrix.installer }}
          path: ${{ runner.temp }}/signed-app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-windows-${{ matrix.triple }}
          path: ${{ runner.temp }}/cli
      - name: The MSI, built from the signed files
        id: msi
        shell: pwsh
        working-directory: apps/windows
        env:
          INSTALLER: ${{ matrix.installer }}
          TRIPLE: ${{ matrix.triple }}
          MSI_VERSION: ${{ steps.numbers.outputs.msi }}
          SIGNED: ${{ needs.guard.outputs.signed }}
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'app'
          Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'signed-app\*') -Destination $app -Recurse -Force
          $top = "pitboard-$env:GITHUB_REF_NAME-$env:TRIPLE"
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP "cli\$top.zip") -DestinationPath (Join-Path $env:RUNNER_TEMP 'zip')
          $commandLine = Join-Path $env:RUNNER_TEMP "zip\$top\pitboard.exe"
          $completions = Join-Path $env:RUNNER_TEMP "zip\$top\completions\pitboard.ps1"
          $out = Join-Path $env:RUNNER_TEMP 'msi'
          dotnet build Pitboard.Installer -c Release -o $out "-p:InstallerPlatform=$env:INSTALLER" "-p:PitboardApp=$app" `
            "-p:PitboardCommandLine=$commandLine" "-p:PitboardCompletions=$completions" "-p:PitboardMsiVersion=$env:MSI_VERSION" `
            "-p:PitboardShareSigned=$env:SIGNED"
          if ($LASTEXITCODE -ne 0) { throw "dotnet build exited $LASTEXITCODE" }
          $dist = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'dist')
          $msi = Join-Path $dist "Pitboard-$env:GITHUB_REF_NAME-windows-$env:INSTALLER.msi"
          Move-Item -LiteralPath (Join-Path $out 'Pitboard.msi') -Destination $msi
          & "$env:GITHUB_WORKSPACE/.github/scripts/validate-windows-msi.ps1" -Msi $msi
          $folder = & "$env:GITHUB_WORKSPACE/.github/scripts/extract-msi.ps1" -Msi $msi -Destination (Join-Path $env:RUNNER_TEMP 'image')
          Write-Output "Built $msi and extracted it into $folder."
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "folder=$folder" >> $env:GITHUB_OUTPUT
          "command-line=$commandLine" >> $env:GITHUB_OUTPUT
          "completions=$completions" >> $env:GITHUB_OUTPUT
      - name: "The MSI's files: the checks of the Release build"
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          BASE: ${{ needs.guard.outputs.base }}
          FILE_VERSION: ${{ steps.numbers.outputs.file }}
          KEY: ${{ secrets.WINDOWS_UPDATE_PUBLIC_KEY }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
          IMAGE: ${{ steps.msi.outputs.folder }}
        run: >
          ./.github/scripts/check-windows-app.ps1 -Folder $env:IMAGE -Triple $env:TRIPLE
          -GatedLibrary (Join-Path $env:RUNNER_TEMP 'app\pitboard_ffi.dll') -Signer $env:SUBJECT -UpdateKey $env:KEY
          -Version $env:BASE -FileVersion $env:FILE_VERSION
      - name: "The MSI: its version, its layout, the zip's command line and completions, and the signed package"
        shell: pwsh
        env:
          MSI: ${{ steps.msi.outputs.msi }}
          IMAGE: ${{ steps.msi.outputs.folder }}
          MSI_VERSION: ${{ steps.numbers.outputs.msi }}
          COMMAND_LINE: ${{ steps.msi.outputs.command-line }}
          COMPLETIONS: ${{ steps.msi.outputs.completions }}
          SIGNED: ${{ needs.guard.outputs.signed }}
        run: |
          $given = @{ Msi = $env:MSI; Folder = $env:IMAGE; MsiVersion = $env:MSI_VERSION; CommandLine = $env:COMMAND_LINE; Completions = $env:COMPLETIONS }
          if ($env:SIGNED -eq 'true') {
            $given.Share = $true
            $given.Package = Join-Path $env:RUNNER_TEMP 'signed-app\PitboardShare.msix'
          }
          ./.github/scripts/check-windows-msi.ps1 @given
      - name: Every program of Pitboard's in it, and its package, as the signer left them
        shell: pwsh
        env:
          SIGNED: ${{ needs.guard.outputs.signed }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
          IMAGE: ${{ steps.msi.outputs.folder }}
        run: |
          $mode = if ($env:SIGNED -eq 'true') { 'signed' } else { 'unsigned' }
          $ours = @(Get-ChildItem -LiteralPath $env:IMAGE -Recurse -File |
            Where-Object { $_.Name -like 'pitboard*' -and $_.Extension -in '.exe', '.dll', '.msix' } | ForEach-Object FullName)
          ./.github/scripts/verify-windows-signatures.ps1 -Path $ours -Mode $mode -Subject $env:SUBJECT
      # Every Release build, betas included, reads the feed of full releases with the key it carries,
      # and WinSparkle takes an update only when that key verifies it: there is no second route. So the
      # key is compared with the newest earlier release that shipped an MSI, betas included. Both of
      # that release's MSIs come down, for the components' check.
      - name: The last release's MSIs, and the update key this machine's shipped
        id: key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ matrix.installer }}
          IMAGE: ${{ steps.msi.outputs.folder }}
        run: |
          $read = './.github/scripts/read-assembly.ps1'
          "now=$(& $read -Assembly (Join-Path $env:IMAGE 'Pitboard.dll') -Metadata WindowsUpdatePublicKey)" >> $env:GITHUB_OUTPUT
          $dir = Join-Path $env:RUNNER_TEMP 'previous'
          $previous = & ./.github/scripts/previous-msis.ps1 -Installer $env:INSTALLER -Destination $dir -Except $env:GITHUB_REF_NAME
          if (-not $previous) { exit 0 }
          $name = "Pitboard-$previous-windows-$env:INSTALLER.msi"
          $folder = & ./.github/scripts/extract-msi.ps1 -Msi (Join-Path $dir $name) -Destination (Join-Path $env:RUNNER_TEMP 'previous-image')
          "previous=$previous" >> $env:GITHUB_OUTPUT
          "previous-folder=$dir" >> $env:GITHUB_OUTPUT
          "was=$(& $read -Assembly (Join-Path $folder 'Pitboard.dll') -Metadata WindowsUpdatePublicKey)" >> $env:GITHUB_OUTPUT
      - name: The update key this release ships
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          NOW: ${{ steps.key.outputs.now }}
          PREVIOUS: ${{ steps.key.outputs.previous }}
          WAS: ${{ steps.key.outputs.was }}
          ROTATION: ${{ vars.WINDOWS_UPDATE_KEY_ROTATION }}
        run: sh .github/scripts/windows-update-key.sh "$VERSION" "$NOW" "$PREVIOUS" "$WAS" "$ROTATION"
      # The new product goes in before the old one is removed, and either machine's MSI replaces the
      # other's (Package.wxs).
      - name: Each component keeps the GUID the last release's MSIs gave its key path
        if: steps.key.outputs.previous != ''
        shell: pwsh
        env:
          MSI: ${{ steps.msi.outputs.msi }}
          PREVIOUS: ${{ steps.key.outputs.previous-folder }}
        run: |
          $last = @(Get-ChildItem -LiteralPath $env:PREVIOUS -File -Filter '*.msi' | ForEach-Object FullName)
          ./.github/scripts/check-msi-components.ps1 -Msi $env:MSI -Previous $last
      # Not dist-: the MSI reaches publish only through windows-sign-msi and windows-msi.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-msi-${{ matrix.installer }}
          path: ${{ runner.temp }}/dist/*.msi
          if-no-files-found: error

  # Stage two: both MSIs in one request, as windows-sign signs the zips and the app's programs. If the
  # signer signs an MSI's files and the MSI in one request, this and windows-sign become one.
  windows-sign-msi:
    needs: [guard, app-windows-package]
    if: needs.guard.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    # Takes deployments from v* tags only, and holds the signer's credentials.
    environment: windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-msi-*
          path: ${{ runner.temp }}/unsigned-msi
          merge-multiple: true
      - name: Sign
        shell: pwsh
        env:
          SIGNED: ${{ needs.guard.outputs.signed }}
          SIGNER: ${{ vars.WINDOWS_SIGNER }}
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed-msi'
          New-Item -ItemType Directory -Force -Path $signed | Out-Null
          if ($env:SIGNED -ne 'true') {
            Copy-Item -Path (Join-Path $env:RUNNER_TEMP 'unsigned-msi\*.msi') -Destination $signed
            Write-Output 'No signer is set, so this beta ships its MSIs unsigned.'
            exit 0
          }
          throw "no signing step for $env:SIGNER"
      - name: Both MSIs, and no other file
        shell: pwsh
        run: |
          $names = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'signed-msi') -File | ForEach-Object Name | Sort-Object)
          $expected = @('arm64', 'x64' | ForEach-Object { "Pitboard-$env:GITHUB_REF_NAME-windows-$_.msi" })
          if (($names -join ', ') -ne ($expected -join ', ')) { throw "windows-sign-msi has $($names -join ', ') to hand on" }
      # Not dist-: each MSI's programs are checked on the machine that can extract it, in windows-msi.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-msi-x64
          path: ${{ runner.temp }}/signed-msi/*-windows-x64.msi
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-msi-arm64
          path: ${{ runner.temp }}/signed-msi/*-windows-arm64.msi
          if-no-files-found: error
          overwrite: true

  # Every MSI reaches publish through here, checked on its own machine, since msiexec /a extracts an
  # MSI only where it could install it: its signature and each program of Pitboard's in it signed by
  # the signer's subject when the guard says signed and none signed when it does not, every other
  # program as its maker signs it, and the same files and tables the MSI was built with.
  windows-msi:
    needs: [guard, windows-sign-msi]
    if: needs.guard.outputs.windows == 'true'
    strategy:
      matrix:
        include:
          - os: windows-2025
            installer: x64
          - os: windows-11-arm
            installer: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-msi-${{ matrix.installer }}
          path: ${{ runner.temp }}/signed-msi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-msi-${{ matrix.installer }}
          path: ${{ runner.temp }}/unsigned-msi
      - name: Every signature
        shell: pwsh
        env:
          SIGNED: ${{ needs.guard.outputs.signed }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          $mode = if ($env:SIGNED -eq 'true') { 'signed' } else { 'unsigned' }
          $msi = Join-Path $env:RUNNER_TEMP "signed-msi\Pitboard-$env:GITHUB_REF_NAME-windows-$env:INSTALLER.msi"
          ./.github/scripts/verify-windows-signatures.ps1 -Path $msi -Mode $mode -Subject $env:SUBJECT `
            -Built (Join-Path $env:RUNNER_TEMP 'unsigned-msi')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-msi-${{ matrix.installer }}
          path: ${{ runner.temp }}/signed-msi/*.msi
          if-no-files-found: error
          overwrite: true

  # Each MSI as published, EdDSA-signed with the Windows update key by Sparkle's sign_update, which
  # WinSparkle's signatures are, for every Windows release: a beta's copies update into the next
  # full release, so its MSIs must carry the key pair's public half too. The latest full release
  # also gets appcast-windows.xml. Only this job reads WINDOWS_UPDATE_PRIVATE_KEY, in the
  # windows-update environment, which takes deployments from v* tags only.
  windows-update-sign:
    needs: [guard, windows-msi]
    if: needs.guard.outputs.windows == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    environment: windows-update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-windows-msi-*
          path: ${{ runner.temp }}/msi
          merge-multiple: true
      # The release archive of the Sparkle apps/macos/project.yml pins, by its SHA-256 as GitHub
      # lists it. A Sparkle raised there fails here until its archive's line below is raised too.
      - name: sign_update
        run: |
          set -euo pipefail
          version=$(sed -n '/^  Sparkle:$/,/^  [A-Za-z]/s/^    exactVersion: //p' apps/macos/project.yml)
          case $version in
            2.10.1) pinned=1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27 ;;
            *)
              echo "apps/macos/project.yml pins Sparkle $version, and release.yml has no SHA-256 for its archive" >&2
              exit 1
              ;;
          esac
          archive=$RUNNER_TEMP/Sparkle-$version.tar.xz
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$archive" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$version/Sparkle-$version.tar.xz"
          echo "$pinned  $archive" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle" ./bin/sign_update
      - name: Each MSI's signature, and appcast-windows.xml for the latest full release
        env:
          PRIVATE_KEY: ${{ secrets.WINDOWS_UPDATE_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ secrets.WINDOWS_UPDATE_PUBLIC_KEY }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          printf '%s\n' "$PRIVATE_KEY" | sh .github/scripts/windows-update-sign.sh "$GITHUB_REF_NAME" "$LATEST" "$PUBLIC_KEY" \
            "$RUNNER_TEMP/msi" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            "$RUNNER_TEMP/dist/appcast-windows.xml" "$RUNNER_TEMP/sparkle/bin/sign_update" swift .github/scripts/eddsa-verify.swift
      - if: needs.guard.outputs.latest == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows-feed
          path: ${{ runner.temp }}/dist/appcast-windows.xml
          if-no-files-found: error
          overwrite: true

  # The menu bar app, signed and notarised when the Apple secrets are set; without them it
  # is still built and released, ad-hoc signed, which Gatekeeper warns about on first
  # launch. RELEASING.md lists the secrets.
  app:
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - id: apple
        uses: ./.github/actions/apple-keychain
        with:
          certificate: ${{ secrets.CERTIFICATES_P12 }}
          password: ${{ secrets.CERTIFICATES_PASSWORD }}

      - uses: ./.github/actions/xcodegen
      - name: Build
        env:
          SIGN_IDENTITY: ${{ steps.apple.outputs.identity }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./apps/macos/scripts/build-app.sh

      # An installed copy checks the archive against the public key in the bundle it came
      # from, and takes an update whose key has changed only through the other route, which
      # needs the new bundle to satisfy the old one's designated requirement. That holds
      # for a Developer ID build and never for an ad-hoc one, whose designated requirement
      # is its own cdhash. So a changed key either is a rotation somebody is running on
      # purpose or strands whoever installed an ad-hoc build, and no revocation reaches
      # either. The key is compared with the one the last release shipped, and a change is
      # refused unless the repository variable SPARKLE_KEY_ROTATION names this version.
      - name: The update key this release ships
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          ROTATION: ${{ vars.SPARKLE_KEY_ROTATION }}
        run: |
          plist=apps/macos/build/Pitboard.app/Contents/Info.plist
          now=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$plist" 2>/dev/null || true)
          if [ -z "$now" ]; then
            echo "the app carries no update key: SPARKLE_PUBLIC_KEY is not set" >&2
            exit 1
          fi
          shipped=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.draft == false and .prerelease == false)
                | select([.assets[].name] | any(startswith("Pitboard-")))
                | .tag_name')
          previous=$(printf '%s\n' "$shipped" | grep -vx "$TAG" | awk 'NR == 1' || true)
          if [ -z "$previous" ]; then
            echo "no earlier release ships an app, so there is no key to compare with"
            exit 0
          fi
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Pitboard-*-macos.zip' --dir "$RUNNER_TEMP/previous"
          ditto -x -k "$RUNNER_TEMP/previous"/*.zip "$RUNNER_TEMP/previous/unpacked"
          was=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" \
            "$RUNNER_TEMP/previous/unpacked/Pitboard.app/Contents/Info.plist" 2>/dev/null || true)
          if [ -z "$was" ]; then
            echo "$previous shipped no update key, so there is nothing to compare with"
            exit 0
          fi
          if [ "$now" = "$was" ]; then
            echo "the update key is the one $previous shipped"
            exit 0
          fi
          if [ "$ROTATION" = "$VERSION" ]; then
            echo "declared rotation: $previous shipped $was, $VERSION ships $now"
            exit 0
          fi
          echo "this build's update key is $now and $previous shipped $was." >&2
          echo "An installed copy takes this only through the Apple code signing route," >&2
          echo "which an ad-hoc installed copy has not got. Read 'Rotate the update" >&2
          echo "key' in RELEASING.md, and set the repository variable" >&2
          echo "SPARKLE_KEY_ROTATION to $VERSION when this release means to." >&2
          exit 1

      - name: Notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent apps/macos/build/Pitboard.app "$RUNNER_TEMP/notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/key.p8"
          # Stapled, so the app opens on a machine that cannot reach Apple.
          xcrun stapler staple apps/macos/build/Pitboard.app

      # No `if` on the appcast. Every copy already installed reads the newest release's feed,
      # so a release that skips it strands them, and a missing key has to be a red job
      # rather than a quiet omission.
      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is not set: the feed cannot be signed" >&2
            exit 1
          fi
          out=$RUNNER_TEMP/dist
          mkdir -p "$out"
          ditto -c -k --keepParent apps/macos/build/Pitboard.app \
            "$out/Pitboard-${GITHUB_REF_NAME}-macos.zip"
          if [ "$LATEST" != "true" ]; then
            echo "only the latest release publishes a feed, so no copy updates into this one"
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            apps/macos/build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              "$out"
          # generate_appcast cross-checks the private key it is given against the bundle's
          # SUPublicEDKey and, when they disagree, writes the feed with no signature at all
          # and exits 0. An unsigned feed is one every installed copy refuses, so the two
          # secrets disagreeing has to be found here rather than by them.
          if ! grep -q 'sparkle:edSignature="' "$out/appcast.xml"; then
            echo "the feed was written without a signature, which is what generate_appcast" >&2
            echo "does when SPARKLE_PRIVATE_KEY is not the key SPARKLE_PUBLIC_KEY names" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-app
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/appcast.xml

  # A skipped job skips every job after it in the chain unless their `if` says otherwise, and the
  # Windows jobs are skipped below 1.0.0. So publish and the jobs after it name what they need.
  publish:
    needs: [guard, build, app, windows-sign, windows-msi, windows-update-sign]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.app.result == 'success' &&
      ((needs.guard.outputs.windows == 'false' && needs.windows-sign.result == 'skipped' &&
      needs.windows-msi.result == 'skipped' && needs.windows-update-sign.result == 'skipped') ||
      (needs.windows-sign.result == 'success' && needs.windows-msi.result == 'success' &&
      needs.windows-update-sign.result == 'success')) }}
    runs-on: ubuntu-latest
    # Uploading the MSIs takes most of it.
    timeout-minutes: 15
    # Required reviewers on this environment are what stops an unexpected tag walking into
    # a crates.io upload, which is the one step of a release nobody can undo. crates.io
    # matches the environment name as well as the repository and the workflow, so a run
    # outside it cannot mint a publish token at all.
    environment: release
    permissions:
      contents: write
      # Provenance: GitHub signs a statement of which workflow, at which commit, built
      # each file, so a downloader can check it with `gh attestation verify`. The same
      # identity is what crates.io exchanges for a token, so there is no second secret.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      # The .NET packages' bills of materials, a folder for each architecture's.
      - if: needs.guard.outputs.windows == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bom-windows-*
          path: ${{ runner.temp }}/bom-windows

      # A tampered download is a realistic threat for a tool that handles OAuth tokens.
      - name: Checksums
        working-directory: ${{ runner.temp }}/dist
        run: |
          set -- *.tar.gz *.zip
          for file in *.msi; do
            if [ -e "$file" ]; then
              set -- "$@" "$file"
            fi
          done
          sha256sum -- "$@" > SHA256SUMS
      # install.sh carries the tarballs' checksums, so it is filled before its own line goes in.
      - name: Install script
        working-directory: ${{ runner.temp }}/dist
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          sh "$GITHUB_WORKSPACE/.github/scripts/fill-template.sh" \
            "$GITHUB_WORKSPACE/packaging/install.sh" install.sh "$VERSION" SHA256SUMS
          sh -n install.sh
          sha256sum -- install.sh >> SHA256SUMS
      # The tap is written from this file, handed to the tap job inside this run, so the
      # checksums Homebrew checks are the ones taken here of the files this job publishes.
      # Read back from the release instead, they would be whatever the release held by then,
      # and anyone who could change the release could change a tarball and its line together.
      # Overwritten, so a publish job run again can hand it over again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: ${{ runner.temp }}/dist/SHA256SUMS
          overwrite: true

      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx
      # One bill of materials per artefact, read out of the lockfile, so what is inside a
      # download can be answered without the download. cargo-cyclonedx writes a file beside
      # every Cargo.toml in the workspace whatever --manifest-path says, so the one that
      # belongs to the crate in the artefact is kept and the rest deleted. A target that is
      # not installed still resolves, because the filter comes from cargo metadata and not
      # from a standard library it has to find.
      - name: Bill of materials
        env:
          WINDOWS: ${{ needs.guard.outputs.windows }}
          SIGNED: ${{ needs.guard.outputs.signed }}
        run: |
          bom() {
            cargo cyclonedx --manifest-path "crates/$1/Cargo.toml" --target "$2" \
              --format json --spec-version 1.5 --all --override-filename bom
            mv "crates/$1/bom.json" "$3"
            find crates -name bom.json -delete
          }
          # macOS and musl resolve different dependencies, so each target has its own.
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bom pitboard "$target" \
              "$RUNNER_TEMP/dist/pitboard-${GITHUB_REF_NAME}-${target}.tar.gz.cdx.json"
          done
          if [ "$WINDOWS" = true ]; then
            for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
              bom pitboard "$target" \
                "$RUNNER_TEMP/dist/pitboard-${GITHUB_REF_NAME}-${target}.zip.cdx.json"
            done
          fi
          # The app carries the core for both macOS architectures, which resolve to the
          # same dependencies, the command line, the Share extension's pitboard-share-ffi,
          # and Sparkle, which no lockfile here mentions. The extension's library is no
          # download of its own, so its bill of materials stays out of dist.
          app=$RUNNER_TEMP/dist/Pitboard-${GITHUB_REF_NAME}-macos.zip.cdx.json
          bom pitboard-ffi aarch64-apple-darwin "$app"
          bom pitboard-share-ffi aarch64-apple-darwin "$RUNNER_TEMP/pitboard-share-ffi.cdx.json"
          python3 .github/scripts/sbom-add-crate.py "$app" \
            "$RUNNER_TEMP/dist/pitboard-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz.cdx.json"
          python3 .github/scripts/sbom-add-crate.py "$app" "$RUNNER_TEMP/pitboard-share-ffi.cdx.json"
          python3 .github/scripts/sbom-add-sparkle.py "$app" \
            apps/macos/Pitboard.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          # Each MSI carries the core for its architecture, the command line of that zip, the .NET
          # packages app-windows-build listed, WinSparkle among them, and, where a signed package
          # brings the share target, pitboard-share-ffi and PitboardShare.exe's packages.
          if [ "$WINDOWS" = true ]; then
            for pair in x64:x86_64-pc-windows-msvc arm64:aarch64-pc-windows-msvc; do
              arch=${pair%%:*}
              target=${pair#*:}
              msi=$RUNNER_TEMP/dist/Pitboard-${GITHUB_REF_NAME}-windows-$arch.msi.cdx.json
              dotnet=$RUNNER_TEMP/bom-windows/bom-windows-$arch
              bom pitboard-ffi "$target" "$msi"
              python3 .github/scripts/sbom-add-crate.py "$msi" \
                "$RUNNER_TEMP/dist/pitboard-${GITHUB_REF_NAME}-${target}.zip.cdx.json"
              python3 .github/scripts/sbom-add-crate.py "$msi" "$dotnet/dotnet-app.cdx.json"
              if [ "$SIGNED" = true ]; then
                bom pitboard-share-ffi "$target" "$RUNNER_TEMP/pitboard-share-ffi-$arch.cdx.json"
                python3 .github/scripts/sbom-add-crate.py "$msi" "$RUNNER_TEMP/pitboard-share-ffi-$arch.cdx.json"
                python3 .github/scripts/sbom-add-crate.py "$msi" "$dotnet/dotnet-share.cdx.json"
              fi
            done
          fi

      # crates.io gives this job a token of its own, made from GitHub's word about which
      # workflow in which repository is running, and revokes it when the job ends. There is
      # no CARGO_REGISTRY_TOKEN left to leak and nothing to rotate. What can be wrong
      # instead is the registration on crates.io, so the exchange runs on a pre-release
      # too, where finding out costs nothing. The token lasts 30 minutes, so the exchange
      # comes right before the upload.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: registry
      # First, because a crates.io upload cannot be undone and a GitHub release can. The
      # core first, then the command line that depends on it. Skipped when that version is
      # already there, so a release that failed later can simply be run again.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
          CRATES: ${{ needs.guard.outputs.crates }}
          BASE: ${{ needs.guard.outputs.base }}
          CORE: ${{ needs.guard.outputs.core }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "crates.io returned no token; check Trusted Publishing on both crates" >&2
            exit 1
          fi
          if [ "$CRATES" != "true" ]; then
            echo "the token exchange works; a release candidate publishes nothing to crates.io"
            exit 0
          fi
          # cargo publish refuses every crate it is given when one of them is already there.
          set --
          for crate in "pitboard-core $CORE" "pitboard $BASE"; do
            name=${crate% *}
            version=${crate#* }
            on_crates_io=$(curl -fsSL -A "pitboard release" \
              "https://crates.io/api/v1/crates/$name/$version" -o /dev/null -w "%{http_code}" || true)
            if [ "$on_crates_io" = "200" ]; then
              echo "$name $version is already on crates.io; not publishing it again"
            else
              set -- "$@" -p "$name"
            fi
          done
          if [ "$#" -gt 0 ]; then
            cargo publish --locked "$@"
          fi

      # SHA256SUMS is made in this job and published in the release it describes, so on its
      # own it is evidence against a download that went wrong and not against anyone who
      # could change the release. Attested, it is both.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.cdx.json
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/install.sh
      # The feed decides what every installed copy runs next, which makes it the most worth
      # attesting of anything here. Only the latest release publishes one.
      - if: needs.guard.outputs.windows == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*.msi
      - if: needs.guard.outputs.latest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/appcast.xml
      - if: needs.guard.outputs.latest == 'true' && needs.guard.outputs.windows == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/appcast-windows.xml

      - name: What changed
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      # An immutable release takes files only while a draft; softprops drafts only full releases.
      # GitHub makes each full release it publishes latest unless told otherwise.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          make_latest: ${{ needs.guard.outputs.latest }}
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          draft: ${{ needs.guard.outputs.prerelease == 'true' }}
          files: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.msi
            ${{ runner.temp }}/dist/*.cdx.json
            ${{ runner.temp }}/dist/appcast.xml
            ${{ runner.temp }}/dist/appcast-windows.xml
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/install.sh
      - if: needs.guard.outputs.prerelease == 'true'
        name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # What an installed copy will actually fetch, fetched. A release whose feed is missing,
  # stale, marked pre-release or signed with the wrong key is only visible from outside.
  #
  # The signature is checked against the public key in the bundle this release published,
  # which is the key an installed copy checks it against. It used to be checked with
  # SPARKLE_PRIVATE_KEY, which is the key that made it: the job that signed the feed was
  # the job that agreed with itself about the signature, and a wrong key passed. Nothing
  # here reads a secret any more.
  feed:
    needs: [guard, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.latest == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feed=$RUNNER_TEMP/appcast.xml
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$feed" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          version=${GITHUB_REF_NAME#v}
          if ! grep -q "<sparkle:shortVersionString>$version<" "$feed"; then
            echo "the published feed does not offer $version:" >&2
            cat "$feed" >&2
            exit 1
          fi
          url=$(sed -n 's/.*enclosure url="\([^"]*\)".*/\1/p' "$feed" | head -1)
          signature=$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' "$feed" | head -1)
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/update.zip" "$url"
          ditto -x -k "$RUNNER_TEMP/update.zip" "$RUNNER_TEMP/unpacked"
          key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" \
            "$RUNNER_TEMP/unpacked/Pitboard.app/Contents/Info.plist")
          swift .github/scripts/eddsa-verify.swift "$key" "$signature" "$RUNNER_TEMP/update.zip"
          spctl --assess --type execute -v "$RUNNER_TEMP/unpacked/Pitboard.app"

          # The attestation is the part of this that says who published the file, rather
          # than only that the bytes arrived whole. Sigstore takes a moment to serve one
          # that was written seconds ago.
          attested() {
            for attempt in 1 2 3 4 5; do
              gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" && return 0
              echo "no attestation for $1 yet (attempt $attempt)"
              sleep 15
            done
            return 1
          }
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/SHA256SUMS" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/SHA256SUMS"
          attested "$feed"
          attested "$RUNNER_TEMP/SHA256SUMS"
          attested "$RUNNER_TEMP/update.zip"

  # The Windows feed, fetched as an installed copy fetches it, in two halves. Each MSI is read on
  # its own machine, since msiexec /a extracts an MSI only where it could install it, for the key
  # in its Pitboard.dll, which is what every copy installed from it checks with. Nothing here
  # reads a secret.
  windows-feed-key:
    needs: [guard, publish]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.latest == 'true' &&
      needs.guard.outputs.windows == 'true' }}
    strategy:
      matrix:
        include:
          - os: windows-2025
            installer: x64
          - os: windows-11-arm
            installer: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The key in the published MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ matrix.installer }}
          SIGNED: ${{ needs.guard.outputs.signed }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $name = "Pitboard-$env:GITHUB_REF_NAME-windows-$env:INSTALLER.msi"
          $dir = Join-Path $env:RUNNER_TEMP 'published'
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $name --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
          $msi = Join-Path $dir $name
          $mode = if ($env:SIGNED -eq 'true') { 'signed' } else { 'unsigned' }
          ./.github/scripts/verify-windows-signatures.ps1 -Path $msi -Mode $mode -Subject $env:SUBJECT
          $folder = & ./.github/scripts/extract-msi.ps1 -Msi $msi -Destination (Join-Path $env:RUNNER_TEMP 'image')
          $key = & ./.github/scripts/read-assembly.ps1 -Assembly (Join-Path $folder 'Pitboard.dll') -Metadata WindowsUpdatePublicKey
          if (-not $key) { throw "$name carries no update key" }
          $out = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'key')
          [IO.File]::WriteAllText((Join-Path $out "$env:INSTALLER.txt"), $key)
          Write-Output "$name carries the update key $key."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-feed-key-${{ matrix.installer }}
          path: ${{ runner.temp }}/key
          if-no-files-found: error
          overwrite: true

  windows-feed:
    needs: [guard, windows-feed-key]
    if: ${{ !cancelled() && needs.windows-feed-key.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-feed-key-*
          path: ${{ runner.temp }}/key
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          key=$(cat "$RUNNER_TEMP/key/x64.txt")
          if [ "$(cat "$RUNNER_TEMP/key/arm64.txt")" != "$key" ]; then
            echo "the x64 and the ARM64 MSI carry different update keys" >&2
            exit 1
          fi
          feed=$RUNNER_TEMP/appcast-windows.xml
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$feed" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast-windows.xml"
          # Each architecture's enclosure as WinSparkle reads it: url, length and signature.
          python3 - "$feed" "$VERSION" > "$RUNNER_TEMP/enclosures" <<'EOF'
          import sys
          from xml.etree import ElementTree
          sparkle = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          feed, version = sys.argv[1], sys.argv[2]
          items = ElementTree.parse(feed).getroot().find("channel").findall("item")
          offered = [i for i in items if i.findtext(f"{sparkle}version") == version]
          by_os = {}
          for item in offered:
              for enclosure in item.findall("enclosure"):
                  by_os[enclosure.get(f"{sparkle}os")] = enclosure
          if sorted(by_os) != ["windows-arm64", "windows-x64"]:
              sys.exit(f"the published feed does not offer {version} for windows-x64 and windows-arm64: {sorted(by_os)}")
          for os, enclosure in sorted(by_os.items()):
              print(os, enclosure.get("url"), enclosure.get("length"), enclosure.get(f"{sparkle}edSignature"))
          EOF
          downloads="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          while read -r os url length signature; do
            arch=${os#windows-}
            expected=$downloads/Pitboard-${GITHUB_REF_NAME}-windows-$arch.msi
            if [ "$url" != "$expected" ]; then
              echo "the feed's $os enclosure is $url, not $expected" >&2
              exit 1
            fi
            msi=$RUNNER_TEMP/Pitboard-${GITHUB_REF_NAME}-windows-$arch.msi
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$msi" "$url"
            if [ "$(wc -c < "$msi" | tr -d ' ')" != "$length" ]; then
              echo "the feed gives $os a length of $length, and its MSI has another" >&2
              exit 1
            fi
            swift .github/scripts/eddsa-verify.swift "$key" "$signature" "$msi"
          done < "$RUNNER_TEMP/enclosures"

          attested() {
            for attempt in 1 2 3 4 5; do
              gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" && return 0
              echo "no attestation for $1 yet (attempt $attempt)"
              sleep 15
            done
            return 1
          }
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/SHA256SUMS" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/SHA256SUMS"
          attested "$feed"
          attested "$RUNNER_TEMP/SHA256SUMS"
          for arch in x64 arm64; do
            attested "$RUNNER_TEMP/Pitboard-${GITHUB_REF_NAME}-windows-$arch.msi"
          done

  # `brew install datlechin/tap/pitboard` is in the README's install section, so the tap is
  # part of a release rather than something done to it afterwards. It used to be a workflow
  # in the tap repository, waking every six hours and taking the checksum of whatever it
  # downloaded; between those two a release could be finished and green for most of a day
  # with the tap still serving the version before it, and nothing anywhere said so. The
  # checksums written here are the SHA256SUMS the publish job took of the files it
  # published, and a re-run of this job alone still reads that same file.
  #
  # The tap holds two casks and no formula: pitboard, the command line from the release's
  # tarballs, and pitboard-app, the app with the same command line inside it. Nothing in
  # either is built on the machine that installs it.
  tap:
    needs: [guard, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # HOMEBREW_TAP_TOKEN is the only credential in this release that reaches another
    # repository, so it lives in an environment of its own and no other job can read it.
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: ${{ runner.temp }}/sums
      - env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap cannot be published" >&2
            exit 1
          fi

          # A header rather than a URL, so the token is not written into a git remote. Its
          # base64 is a different string from the secret, so it is masked by hand or the
          # log would carry it unredacted.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          tap=$RUNNER_TEMP/tap
          git -c "http.extraheader=$auth" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" "$tap"

          # fill-template.sh refuses a missing checksum or a placeholder left, before the push.
          sums=$RUNNER_TEMP/sums/SHA256SUMS
          mkdir -p "$tap/Casks"
          for cask in pitboard pitboard-app; do
            sh .github/scripts/fill-template.sh "packaging/$cask.rb" "$tap/Casks/$cask.rb" \
              "$VERSION" "$sums"
          done
          # The formula built from source and is gone. The migration points whoever still
          # has it at the cask of the same name. Homebrew 7.0.6 follows it only to a trusted
          # cask, on a machine that has installed a cask before. No cask_renames.json moves
          # the old app cask on: it would win every lookup of pitboard.
          cp packaging/tap_migrations.json "$tap/tap_migrations.json"
          rm -f "$tap/Formula/pitboard.rb"
          # The tap's own page, so it cannot go on naming casks the tap no longer has.
          cp packaging/tap-README.md "$tap/README.md"

          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "the tap already serves $VERSION"
            exit 0
          fi
          git commit -m "pitboard $VERSION"
          git -c "http.extraheader=$auth" push

  # What somebody following the README gets, got, on machines with nothing of this
  # repository on them: the command line on macOS and Linux, then on macOS the app, whose
  # copy of the command line is the one on PATH once it is installed.
  brew:
    needs: [guard, tap]
    if: ${{ !cancelled() && needs.tap.result == 'success' && needs.guard.outputs.latest == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # The Linux runners come with Homebrew and leave it off PATH.
      - if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Install the way the README says to
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          cask_version() {
            brew info --json=v2 --cask datlechin/tap/pitboard |
              python3 -c "import json,sys; print(json.load(sys.stdin)['casks'][0]['version'])"
          }
          # The push and this clone are two machines talking to GitHub, so the tap is given
          # a couple of minutes to be servable before it is called stale.
          cask=
          for attempt in $(seq 1 12); do
            brew untap datlechin/tap 2>/dev/null || true
            brew tap datlechin/tap
            cask=$(cask_version)
            [ "$cask" = "$VERSION" ] && break
            echo "the tap serves $cask, waiting for $VERSION (attempt $attempt)"
            sleep 10
          done
          if [ "$cask" != "$VERSION" ]; then
            echo "this release published $VERSION and the tap serves $cask" >&2
            exit 1
          fi
          brew install datlechin/tap/pitboard

      - name: What it installed
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          pitboard --version
          pitboard --version | grep -qw "$VERSION"
          # doctor exits 3 where Claude Code has never run, which is every clean runner, so
          # what is checked here is that the installed binary runs its checks at all.
          exit=0
          pitboard doctor || exit=$?
          case $exit in
            0 | 3) ;;
            *)
              echo "pitboard doctor exited $exit" >&2
              exit 1
              ;;
          esac
          # The man page and the completions, where man and the shells look for them.
          prefix=$(brew --prefix)
          for file in share/man/man1/pitboard.1 etc/bash_completion.d/pitboard \
            share/zsh/site-functions/_pitboard share/fish/vendor_completions.d/pitboard.fish; do
            if [ ! -s "$prefix/$file" ]; then
              echo "the cask left nothing at $prefix/$file" >&2
              exit 1
            fi
          done
          if ! grep -qF "\"pitboard $VERSION\"" "$prefix/share/man/man1/pitboard.1"; then
            echo "the man page is not the one for $VERSION" >&2
            exit 1
          fi

      # The two casks both put pitboard on PATH, so they conflict, and the command line goes
      # before the app comes.
      - if: runner.os == 'macOS'
        name: The app, and the command line inside it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          brew uninstall --cask datlechin/tap/pitboard
          brew install --cask datlechin/tap/pitboard-app
          app=
          for candidate in /Applications "$HOME/Applications"; do
            [ -d "$candidate/Pitboard.app" ] && app=$candidate/Pitboard.app && break
          done
          if [ -z "$app" ]; then
            echo "the cask installed no Pitboard.app" >&2
            exit 1
          fi
          installed=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$app/Contents/Info.plist")
          if [ "$installed" != "$VERSION" ]; then
            echo "the cask says $VERSION and installed $installed" >&2
            exit 1
          fi
          # The copy inside the bundle is the one Sparkle updates, so PATH has to lead to it
          # and not to a copy of its own.
          prefix=$(brew --prefix)
          app=$(realpath "$app")
          linked=$(realpath "$prefix/bin/pitboard")
          if [ "$linked" != "$app/Contents/Helpers/pitboard" ]; then
            echo "pitboard on PATH is $linked, not the app's own" >&2
            exit 1
          fi
          "$prefix/bin/pitboard" --version
          "$prefix/bin/pitboard" --version | grep -qw "$VERSION"
          for file in share/man/man1/pitboard.1 etc/bash_completion.d/pitboard \
            share/zsh/site-functions/_pitboard share/fish/vendor_completions.d/pitboard.fish; do
            case $(realpath "$prefix/$file") in
              "$app/Contents/Resources/"*) ;;
              *)
                echo "$prefix/$file does not lead into the app" >&2
                exit 1
                ;;
            esac
          done
          # macOS refuses to run an app extension that is not sandboxed, and the Share menu
          # then has no Pitboard, nor the gallery its widgets. Read from the installed copy, as
          # notarised and stapled.
          entitled() {
            codesign -d --entitlements - --xml "$1" 2>/dev/null |
              plutil -extract "$2" raw - 2>/dev/null || true
          }
          for appex in PitboardShare PitboardWidgets; do
            if [ "$(entitled "$app/Contents/PlugIns/$appex.appex" 'com\.apple\.security\.app-sandbox')" != true ]; then
              echo "the installed app's $appex.appex is not sandboxed" >&2
              exit 1
            fi
          done
          # The widgets read the glance from the App Group under the team that signed the
          # app, which the cask's zap names; an ad hoc build claims none.
          team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          group=
          if [ -n "$team" ] && [ "$team" != "not set" ]; then
            group=$team.com.usepitboard.Pitboard
          fi
          for bundle in "$app" "$app/Contents/PlugIns/PitboardWidgets.appex"; do
            claimed=$(entitled "$bundle" 'com\.apple\.security\.application-groups.0')
            if [ "$claimed" != "$group" ]; then
              echo "$bundle's App Group is ${claimed:-none}, not ${group:-none}" >&2
              exit 1
            fi
          done
          if [ -n "$group" ] && ! brew cat --cask datlechin/tap/pitboard-app |
            grep -qF "/Library/Group Containers/$group\""; then
            echo "the cask's zap leaves the App Group $group" >&2
            exit 1
          fi

  # The install script run the way its readers run it, on each target and on Alpine.
  install-script:
    needs: [guard, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      # The command line and its man page say Cargo.toml's version, which an rc's tag adds to.
      BASE: ${{ needs.guard.outputs.base }}
      SCRIPT: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh
    steps:
      - name: Install from this release
        run: |
          set -euo pipefail
          curl -fsSL "$SCRIPT" | sh

      - name: What it installed
        run: |
          set -euo pipefail
          pitboard=$HOME/.local/bin/pitboard
          share=$HOME/.local/share
          "$pitboard" --version
          "$pitboard" --version | grep -qw "$BASE"
          # doctor exits 3 where Claude Code has never run, which is every clean runner.
          exit=0
          "$pitboard" doctor || exit=$?
          case $exit in
            0 | 3) ;;
            *)
              echo "pitboard doctor exited $exit" >&2
              exit 1
              ;;
          esac
          for file in bash-completion/completions/pitboard zsh/site-functions/_pitboard \
            fish/vendor_completions.d/pitboard.fish; do
            if [ ! -s "$share/$file" ]; then
              echo "the install script left nothing at $share/$file" >&2
              exit 1
            fi
          done
          if ! grep -qF "\"pitboard $BASE\"" "$share/man/man1/pitboard.1"; then
            echo "the man page is not the one for $BASE" >&2
            exit 1
          fi

      - name: Run it again
        run: |
          set -euo pipefail
          ln "$HOME/.local/bin/pitboard" "$HOME/.local/pitboard.before"
          curl -fsSL "$SCRIPT" | sh
          if [ "$HOME/.local/bin/pitboard" -ef "$HOME/.local/pitboard.before" ]; then
            echo "the second run wrote into the old copy rather than renaming a new one over it" >&2
            exit 1
          fi
          left=$(find "$HOME/.local/bin" -name '.pitboard.*')
          if [ -n "$left" ]; then
            echo "the second run left $left behind" >&2
            exit 1
          fi
          "$HOME/.local/bin/pitboard" --version | grep -qw "$BASE"

      # Alpine downloads with BusyBox wget and runs the script with BusyBox ash, as a user.
      - if: matrix.os == 'ubuntu-latest'
        name: On Alpine
        run: |
          docker run --rm -e SCRIPT -e BASE alpine sh -euc '
            adduser -D reader
            su reader -c "wget -qO- \"\$SCRIPT\" | sh"
            version=$(su reader -c "\"\$HOME/.local/bin/pitboard\" --version")
            echo "$version"
            [ "$version" = "pitboard $BASE" ]
          '

      # usepitboard.com/install.sh leads to the latest release alone.
      - if: needs.guard.outputs.latest == 'true'
        name: Install the way the README says to
        run: |
          set -euo pipefail
          # The redirect leads to whichever release GitHub names latest, so this waits for it.
          served=
          for attempt in $(seq 1 12); do
            served=$(curl -fsSL https://usepitboard.com/install.sh |
              sed -n 's/^VERSION="\(.*\)"$/\1/p') || served=
            [ "$served" = "$VERSION" ] && break
            echo "usepitboard.com serves ${served:-no script}, waiting for $VERSION (attempt $attempt)"
            sleep 10
          done
          if [ "$served" != "$VERSION" ]; then
            echo "this release published $VERSION and usepitboard.com serves ${served:-no script}" >&2
            echo "RELEASING.md sets out the redirect usepitboard.com/install.sh needs" >&2
            exit 1
          fi
          # Any script with the right VERSION line passes the wait, and plain curl follows http.
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/served.sh" \
            https://usepitboard.com/install.sh
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/release.sh" "$SCRIPT"
          if ! cmp -s "$RUNNER_TEMP/served.sh" "$RUNNER_TEMP/release.sh"; then
            echo "usepitboard.com/install.sh is not this release's script over HTTPS alone" >&2
            echo "RELEASING.md sets out the redirect usepitboard.com/install.sh needs" >&2
            exit 1
          fi
          rm "$HOME/.local/bin/pitboard"
          curl -fsSL https://usepitboard.com/install.sh | sh
          "$HOME/.local/bin/pitboard" --version | grep -qw "$BASE"

      # Sigstore takes a moment to serve an attestation that was written seconds ago.
      - name: The install script's attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            -o "$RUNNER_TEMP/install.sh" "$SCRIPT"
          for attempt in 1 2 3 4 5; do
            gh attestation verify "$RUNNER_TEMP/install.sh" --repo "$GITHUB_REPOSITORY" && exit 0
            echo "no attestation for install.sh yet (attempt $attempt)"
            sleep 15
          done
          exit 1

  # What somebody who downloads a Windows zip or MSI gets, got, on each machine: the published zip
  # and MSI against SHA256SUMS and their attestations, every signature in them, the zip's command
  # line run as a fresh standard user, as winget's validation runs one, and the MSI extracted and
  # never installed. A full release or a beta also installs through cargo-binstall, which takes
  # the zip the crate's metadata names.
  windows-install:
    needs: [guard, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.windows == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cargo-binstall 1.25.3's zip for each, as its immutable release lists it.
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            installer: x64
            binstall-sha256: de20bf4eefbbc4d90888e32938e4e66808c14bfe122458b2dd7d826821529cd9
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            installer: arm64
            binstall-sha256: 52723f6d28fc769c3d9de7841f37bddc0f3bade0061641e9f483fb1f4ff17dcf
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The zip and the MSI, as the release publishes them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TRIPLE: ${{ matrix.triple }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'published'
          $zipName = "pitboard-$env:GITHUB_REF_NAME-$env:TRIPLE.zip"
          $msiName = "Pitboard-$env:GITHUB_REF_NAME-windows-$env:INSTALLER.msi"
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $zipName --pattern $msiName --pattern SHA256SUMS --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
          $sums = Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS')
          foreach ($name in $zipName, $msiName) {
            $file = Join-Path $dir $name
            $lines = @($sums | Where-Object { ($_ -split '\s+', 2)[1] -eq $name })
            if ($lines.Count -ne 1) { throw "SHA256SUMS has $($lines.Count) lines for $name" }
            $listed = ($lines[0] -split '\s+', 2)[0]
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            if ($hash -ne $listed) { throw "$name is $hash, and SHA256SUMS says $listed" }
            # Sigstore takes a moment to serve an attestation that was written seconds ago.
            foreach ($attempt in 1..5) {
              gh attestation verify $file --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -eq 0) { break }
              Write-Output "no attestation for $name yet (attempt $attempt)"
              Start-Sleep -Seconds 15
            }
            if ($LASTEXITCODE -ne 0) { throw "$name has no attestation from this repository" }
          }
          $zip = Join-Path $dir $zipName
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'unpacked')
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSI=$(Join-Path $dir $msiName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Every signature
        shell: pwsh
        env:
          SIGNED: ${{ needs.guard.outputs.signed }}
          SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $mode = if ($env:SIGNED -eq 'true') { 'signed' } else { 'unsigned' }
          ./.github/scripts/verify-windows-signatures.ps1 -Path $env:ZIP, $env:MSI -Mode $mode -Subject $env:SUBJECT
      - name: The command line in it, as a fresh standard user
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          # What pitboard --version says: Cargo.toml's version, which an rc's tag adds to.
          BASE: ${{ needs.guard.outputs.base }}
        run: >
          ./.github/scripts/check-windows-build.ps1 -Triple $env:TRIPLE -Version $env:BASE
          -Exe (Join-Path $env:RUNNER_TEMP "unpacked\pitboard-$env:GITHUB_REF_NAME-$env:TRIPLE\pitboard.exe")
      - id: numbers
        shell: bash
        env:
          BASE: ${{ needs.guard.outputs.base }}
        run: sh .github/scripts/windows-versions.sh "$BASE" >> "$GITHUB_OUTPUT"
      - name: What the MSI lays out
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          MSI_VERSION: ${{ steps.numbers.outputs.msi }}
          SIGNED: ${{ needs.guard.outputs.signed }}
        run: |
          $folder = & ./.github/scripts/extract-msi.ps1 -Msi $env:MSI -Destination (Join-Path $env:RUNNER_TEMP 'msi-image')
          $unpacked = Join-Path $env:RUNNER_TEMP "unpacked\pitboard-$env:GITHUB_REF_NAME-$env:TRIPLE"
          ./.github/scripts/check-windows-msi.ps1 -Msi $env:MSI -Folder $folder -MsiVersion $env:MSI_VERSION `
            -CommandLine (Join-Path $unpacked 'pitboard.exe') -Completions (Join-Path $unpacked 'completions\pitboard.ps1') `
            -Share:($env:SIGNED -eq 'true')
      - if: needs.guard.outputs.crates == 'true'
        name: cargo binstall, from crates.io
        shell: pwsh
        env:
          TRIPLE: ${{ matrix.triple }}
          VERSION: ${{ needs.guard.outputs.version }}
          BINSTALL_SHA256: ${{ matrix.binstall-sha256 }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'binstall'
          New-Item -ItemType Directory -Path $tools | Out-Null
          $zip = Join-Path $tools 'cargo-binstall.zip'
          $url = "https://github.com/cargo-bins/cargo-binstall/releases/download/v1.25.3/cargo-binstall-$env:TRIPLE.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $env:BINSTALL_SHA256) { throw "$url is not the zip read on 15 October 2026" }
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          # crates.io's index serves a version a moment after the upload.
          $pattern = '"vers":"' + [regex]::Escape($env:VERSION) + '"'
          $listed = $false
          foreach ($attempt in 1..12) {
            $index = curl.exe -fsSL https://index.crates.io/pi/tb/pitboard | Out-String
            if ($index -match $pattern) { $listed = $true; break }
            Write-Output "the index has no pitboard $env:VERSION yet (attempt $attempt)"
            Start-Sleep -Seconds 10
          }
          if (-not $listed) { throw "crates.io's index has no pitboard $env:VERSION" }
          # With compile disabled, a wrong zip in the crate's metadata fails here instead of building from source.
          $root = Join-Path $env:RUNNER_TEMP 'binstall-root'
          & (Join-Path $tools 'cargo-binstall.exe') "pitboard@$env:VERSION" --root $root --no-confirm --disable-strategies compile,quick-install
          if ($LASTEXITCODE -ne 0) { throw "cargo binstall exited $LASTEXITCODE" }
          $installed = Join-Path $root 'bin\pitboard.exe'
          $zipped = Join-Path $env:RUNNER_TEMP "unpacked\pitboard-$env:GITHUB_REF_NAME-$env:TRIPLE\pitboard.exe"
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $zipped).Hash) {
            throw "cargo binstall installed another pitboard.exe than the $env:TRIPLE zip holds"
          }
          & $installed --version
          exit $LASTEXITCODE

  # Scoop's bucket holds the command line for Windows, written like the tap from the SHA256SUMS
  # the publish job took. Until datlechin/scoop-bucket and SCOOP_BUCKET_TOKEN exist, it says
  # which is missing and writes nothing.
  scoop:
    needs: [guard, publish]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.latest == 'true' &&
      needs.guard.outputs.windows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # SCOOP_BUCKET_TOKEN reaches another repository, so it lives in an environment of its own.
    environment: scoop-bucket
    outputs:
      written: ${{ steps.bucket.outputs.written }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: ${{ runner.temp }}/sums
      - id: bucket
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          bucket=${GITHUB_REPOSITORY_OWNER}/scoop-bucket
          found=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$bucket")
          case $found in
            200) ;;
            404)
              echo "::warning::$bucket does not exist, so Scoop gets no $VERSION. RELEASING.md says how to make it."
              echo "written=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "GitHub answered $found for $bucket" >&2
              exit 1
              ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "::warning::SCOOP_BUCKET_TOKEN is not set in the scoop-bucket environment, so Scoop gets no $VERSION"
            echo "written=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A header, as for the tap, masked by hand.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          dir=$RUNNER_TEMP/bucket
          git -c "http.extraheader=$auth" clone --depth 1 "https://github.com/$bucket.git" "$dir"
          mkdir -p "$dir/bucket"
          sh .github/scripts/fill-template.sh packaging/scoop/pitboard.json \
            "$dir/bucket/pitboard.json" "$VERSION" "$RUNNER_TEMP/sums/SHA256SUMS"
          cp packaging/scoop/README.md "$dir/README.md"

          cd "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "the bucket already serves $VERSION"
          else
            git commit -m "pitboard $VERSION"
            git -c "http.extraheader=$auth" push
          fi
          echo "written=true" >> "$GITHUB_OUTPUT"

  # What somebody following the bucket's page gets, got, on each Windows machine: Scoop in a
  # folder of its own, the bucket added, and the command line installed from it.
  scoop-install:
    needs: [guard, scoop]
    if: ${{ !cancelled() && needs.scoop.result == 'success' && needs.scoop.outputs.written == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # ScoopInstaller/Install has no releases, so its script is pinned by commit and SHA-256. It
      # installs Scoop from Scoop's master branch, as it does for everybody.
      - name: Scoop, in a folder of its own
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          $url = 'https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 5 -RetryIntervalSec 10
          $pinned = '94F983B190438311E006B957DB7C8422709E0BA62A6C2AC04E278164108F2512'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $pinned) { throw "$url is not the script read on 15 October 2026" }
          $root = Join-Path $env:RUNNER_TEMP 'scoop'
          # Scoop runs as in a terminal, where an error it writes does not stop it.
          $ErrorActionPreference = 'Continue'
          # The job's user is elevated in every program it starts.
          & $installer -ScoopDir $root -RunAsAdmin
          Join-Path $root 'shims' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "SCOOP=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          scoop --version
          exit $LASTEXITCODE
      - name: Install the way the bucket's page says to
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $ErrorActionPreference = 'Continue'
          # The push and this clone are two machines talking to GitHub, so the bucket is given a
          # couple of minutes to be servable before it is called stale.
          $manifest = Join-Path $env:SCOOP 'buckets\pitboard\bucket\pitboard.json'
          $served = $null
          foreach ($attempt in 1..12) {
            if (Test-Path -LiteralPath $manifest) { scoop bucket rm pitboard }
            scoop bucket add pitboard https://github.com/datlechin/scoop-bucket
            if ($LASTEXITCODE -ne 0) { throw "scoop bucket add exited $LASTEXITCODE" }
            $served = (Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json).version
            if ($served -eq $env:VERSION) { break }
            Write-Output "the bucket serves $served, waiting for $env:VERSION (attempt $attempt)"
            Start-Sleep -Seconds 10
          }
          if ($served -ne $env:VERSION) { throw "this release published $env:VERSION and the bucket serves $served" }
          scoop install pitboard/pitboard
          exit $LASTEXITCODE
      - name: What it installed
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $said = (& (Join-Path $env:SCOOP 'shims\pitboard.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "pitboard --version exited $LASTEXITCODE" }
          if ($said -ne "pitboard $env:VERSION") { throw "pitboard --version says '$said', not 'pitboard $env:VERSION'" }
          # This machine's build, not the other one under emulation: the PE header's machine.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $env:SCOOP 'apps\pitboard\current\pitboard.exe'))
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ('Scoop installed a program for machine 0x{0:X4} on {1}' -f $machine, $env:RUNNER_ARCH) }
          Write-Output "$said, for this machine"

  # winget takes each latest release of a package microsoft/winget-pkgs already holds; the first
  # version of each goes in by hand (RELEASING.md). komac writes the manifests with the run's
  # read-only token, check-winget-hashes.py holds each installer's hash to the run's SHA256SUMS,
  # and winget validates them before WINGET_TOKEN opens a pull request from its account's fork.
  winget:
    needs: [guard, publish]
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.latest == 'true' &&
      needs.guard.outputs.windows == 'true' }}
    # winget is on windows-2025 and not on windows-11-arm.
    runs-on: windows-2025
    timeout-minutes: 20
    # WINGET_TOKEN opens pull requests on another repository, so it lives in an environment of
    # its own.
    environment: winget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: ${{ runner.temp }}/sums
      # 2.16.0, since 2.17.0 and 2.17.1 write nothing to --output with --dry-run. Checked against
      # the SHA-256 read on 15 October 2026 and against the release's own SHA256SUMS.
      - name: komac
        shell: pwsh
        run: |
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          $base = 'https://github.com/russellbanks/Komac/releases/download/v2.16.0'
          Invoke-WebRequest -Uri "$base/komac-2.16.0-x86_64-pc-windows-msvc.exe" -OutFile $komac -MaximumRetryCount 5 -RetryIntervalSec 10
          $pinned = 'BDC45BAF028F750DA7519CC8A5F2EAB5DFEF46DFE88650EEB0D0A9BF51446E4F'
          if ((Get-FileHash -LiteralPath $komac -Algorithm SHA256).Hash -ne $pinned) { throw 'komac.exe is not the one read on 15 October 2026' }
          $sums = curl.exe -fsSL "$base/SHA256SUMS" | Out-String
          if ($sums -notmatch "(?m)^$pinned \*komac-2\.16\.0-x86_64-pc-windows-msvc\.exe\r?$") { throw "komac's own SHA256SUMS lists another komac.exe" }
          "KOMAC=$komac" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The manifests, written and checked
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $downloads = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          $packages = [ordered]@{
            'Pitboard.CLI' = "pitboard-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc.zip", "pitboard-$env:GITHUB_REF_NAME-aarch64-pc-windows-msvc.zip"
            # The app's MSIs, which the release builds once the Windows app ships.
            'Pitboard.Pitboard' = "Pitboard-$env:GITHUB_REF_NAME-windows-x64.msi", "Pitboard-$env:GITHUB_REF_NAME-windows-arm64.msi"
          }
          $ready = Join-Path $env:RUNNER_TEMP 'winget-ready.txt'
          New-Item -ItemType File -Force -Path $ready | Out-Null
          foreach ($id in $packages.Keys) {
            $publisher, $name = $id -split '\.', 2
            $path = "manifests/$($publisher.Substring(0, 1).ToLowerInvariant())/$publisher/$name"
            $found = curl.exe -sS -o NUL -w '%{http_code}' -H "Authorization: Bearer $env:GH_TOKEN" "https://api.github.com/repos/microsoft/winget-pkgs/contents/$path"
            if ($found -eq '404') {
              Write-Output "::notice::$id is not in microsoft/winget-pkgs yet, so its first version goes in by hand (RELEASING.md)"
              continue
            }
            if ($found -ne '200') { throw "GitHub answered $found for microsoft/winget-pkgs' $path" }
            # komac opens its pull request with this title.
            $titles = gh api -X GET search/issues -f "q=repo:microsoft/winget-pkgs is:pr in:title $id $env:VERSION" --jq '.items[].title'
            if ($LASTEXITCODE -ne 0) { throw "GitHub's search exited $LASTEXITCODE" }
            if (@($titles | Where-Object { $_ -match "(^|\s)$([regex]::Escape($id)) version $([regex]::Escape($env:VERSION))$" })) {
              Write-Output "::notice::microsoft/winget-pkgs has a pull request for $id $env:VERSION already: answer in it rather than run this again"
              continue
            }
            $out = Join-Path $env:RUNNER_TEMP "winget-$id"
            $urls = @($packages[$id] | ForEach-Object { "$downloads/$_" })
            & $env:KOMAC update $id --version $env:VERSION --urls @urls --dry-run --output $out
            if ($LASTEXITCODE -ne 0) { throw "komac update $id exited $LASTEXITCODE" }
            $manifests = Join-Path $out "$path/$env:VERSION"
            python .github/scripts/check-winget-hashes.py $manifests (Join-Path $env:RUNNER_TEMP 'sums\SHA256SUMS')
            if ($LASTEXITCODE -ne 0) { throw "komac's manifests for $id disagree with SHA256SUMS" }
            # winget exits APPINSTALLER_CLI_ERROR_MANIFEST_VALIDATION_WARNING for warnings alone.
            winget validate --manifest $manifests
            if ($LASTEXITCODE -eq 0x8A150028) {
              Write-Output "::warning::winget validates $id $env:VERSION with warnings"
            } elseif ($LASTEXITCODE -ne 0) {
              throw ('winget validate {0} exited 0x{1:X8}' -f $id, $LASTEXITCODE)
            }
            $manifests | Out-File -FilePath $ready -Append -Encoding utf8
          }
          exit 0
      # The one step that holds WINGET_TOKEN, and it submits only what the step before checked.
      - name: Submit
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ready = @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'winget-ready.txt') | Where-Object { $_ })
          if ($ready.Count -eq 0) {
            Write-Output 'no package to submit'
            exit 0
          }
          if (-not $env:GITHUB_TOKEN) { throw 'WINGET_TOKEN is not set in the winget environment' }
          foreach ($manifests in $ready) {
            & $env:KOMAC submit $manifests --yes
            if ($LASTEXITCODE -ne 0) { throw "komac submit $manifests exited $LASTEXITCODE" }
          }

  # The site lists the latest release and the betas above it as they stood when it was built,
  # and Workers Builds builds it only on a push to main. A release published after that push
  # stays off the site until the next one, so this asks Workers Builds to build main again.
  site:
    needs: [guard, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.guard.outputs.kind != 'rc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          case $HOOK in
            "")
              echo "SITE_DEPLOY_HOOK is not set, so the site does not show this release" >&2
              exit 1
              ;;
            https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/*) ;;
            *)
              echo "SITE_DEPLOY_HOOK is not a Workers Builds deploy hook" >&2
              exit 1
              ;;
          esac
          answer=$(curl -fsS --retry 3 -X POST "$HOOK")
          if ! jq -e '.success == true and (.result.build_uuid | type == "string")' <<<"$answer" >/dev/null; then
            echo "Workers Builds did not start a build: $(jq -c '.errors' <<<"$answer")" >&2
            exit 1
          fi
          jq -r '.result | "Workers Builds build \(.build_uuid)\(if .already_exists then ", already queued" else "" end)"' <<<"$answer"
