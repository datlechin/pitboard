version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # UniFFI moves only together with the C# generator, uniffi-bindgen-cs, which is released
      # for one UniFFI version at a time. Cargo.toml says why.
      - dependency-name: "uniffi*"
      # 0.41 needs a newer SQLite than macOS 14 and 15 have. Cargo.toml says why.
      - dependency-name: rusqlite
        versions: [">=0.41"]
  # "/" alone reads the workflows only, not the actions under .github/actions.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The SDK in global.json. MSTest.Sdk and WixToolset.Sdk beside it are raised by hand:
  # Dependabot does not read msbuild-sdks. No nuget entry: workflows/winsparkle.yml says why.
  - package-ecosystem: dotnet-sdk
    directory: /apps/windows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check takes TypeScript 5 or 6 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
