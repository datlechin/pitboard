name: Something went wrong
description: A command did the wrong thing, or said something that was not true
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        `pitboard doctor --json` answers most of what a report needs. It prints the labels
        you chose, codes, paths and times. No tokens, no email addresses and no account
        identifiers: those become digests, so two mentions of one account line up inside
        your report without naming it, and two reports do not line up with each other.
        Paths under your home are shortened to `~`.

        `pitboard doctor` without `--json` is the one to read yourself; it shows your own
        account, and is not the one to paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it printed, and what you expected instead.
      placeholder: |
        $ pitboard use work
        ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: pitboard doctor --json
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`pitboard --version`, `claude --version`, and your macOS or Linux version."
      placeholder: "pitboard 0.1.4, Claude Code 2.1.278, macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: The last few lines of ~/.pitboard/audit.log
      description: Optional. Times, verbs and labels only, so it is safe to paste.
      render: text
