# flaky-result came in 0.9.131.
nextest-version = "0.9.131"

# These time keychain reads, which `security` calls from other tests slow down. Run first,
# they start without waiting for every running test to end.
[[profile.default.overrides]]
filter = "binary_id(pitboard::cli) & test(/^keychain_write_is_harmless::/)"
threads-required = "num-test-threads"
priority = 100

# 100 pieces, near half of what a runner's Credential Manager takes
# (docs/facts/windows-runners.md), alone so no other test's items run it out of room.
[[profile.default.overrides]]
filter = "binary_id(pitboard-core) & test(=provider::claude::credman::tests::claude_codes_login_round_trips_through_credential_manager_and_shrinks_back_to_one_item)"
threads-required = "num-test-threads"
priority = 100

# These time status lines, which other tests' programs and files slow down. In run 39000408726
# twenty warm runs took 114 ms to 1.19 s, and the test of eight side by side 7.2 s, 1.6 s in a
# median job.
[[profile.default.overrides]]
filter = """
binary_id(pitboard::cli)
& (test(=windows_terminal::a_warm_status_line_run_is_within_its_budget_and_holds_nothing_after)
   | test(=windows_terminal::status_lines_side_by_side_each_keep_their_session))
"""
threads-required = "num-test-threads"
priority = 100

# Two writers at once in one logon session can leave an item one of them deleted for the next
# logon to find, and a read miss what was just written (runs 38886714381, 38888292424). One at a
# time, neither happened.
[test-groups]
credential-manager = { max-threads = 1 }

[[profile.default.overrides]]
filter = """
(binary_id(pitboard-core) & (test(/^host::windows::credman::/) | test(/^provider::claude::credman::/)))
| (binary_id(pitboard::cli) & test(/^credman_write_is_harmless::/))
| (binary_id(pitboard::cli) & test(/^switch_round_trip::.*credential_manager/))
| (binary_id(pitboard::cli) & test(=watch::a_warning_is_printed_though_the_line_it_comes_with_was_printed_before))
| (binary_id(pitboard::cli) & test(=contract::stow))
"""
test-group = "credential-manager"

[profile.ci]
fail-fast = false
# A retry tells a flaky test from a failing one, and a flaky test still fails the run.
retries = 1
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }

# 10,000 replaces of a file on Windows, each flushed to the disk with its folder, outlast the
# 180 s above.
[[profile.ci.overrides]]
filter = "binary_id(pitboard-core) & test(=host::windows::fs::tests::ten_thousand_replaces_never_leave_a_reader_without_the_whole_file)"
slow-timeout = { period = "120s", terminate-after = 5 }

# 1000 sign-ins started and stopped on Windows, each two programs.
[[profile.ci.overrides]]
filter = "binary_id(pitboard-core) & test(=host::windows::job::tests::a_program_started_at_once_is_in_the_job_every_time)"
slow-timeout = { period = "120s", terminate-after = 5 }

# J2's reading, in every run's log.
[[profile.ci.overrides]]
filter = "binary_id(pitboard::cli) & test(=windows_terminal::a_warm_status_line_run_is_within_its_budget_and_holds_nothing_after)"
success-output = "immediate"

[profile.ci.junit]
path = "junit.xml"
