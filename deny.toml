# Pitboard holds OAuth refresh tokens for real accounts, so a compromised or
# unexpectedly-licensed transitive dependency is a realistic, high-consequence risk.

[graph]
# What is actually shipped. The Linux releases are musl, and a musl build pulls in
# different crates than a gnu one, so checking only gnu checks something nobody downloads.
# Windows' two are the only Windows targets the core compiles for, and pull in crates of
# their own, such as windows-sys under rustls' platform verifier.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
# The C# bindings generator runs on a build machine and ships nothing of its own: what it
# writes comes from its templates, and its dependencies (an old clap and askama among them)
# never reach a release. It is kept out of the graph rather than weakening the checks for
# everything that does ship. The Swift generator's dependencies are UniFFI's, already here.
exclude = ["uniffi-bindgen-csharp"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained, not vulnerable, and runs only inside askama's derive at build time; every askama release still uses it" },
]

[licenses]
version = 2
# ISC and BSD-3-Clause come with any real TLS stack in Rust (ring, rustls-webpki). MPL-2.0 is
# UniFFI's, linked unmodified into the native apps; its copyleft covers only its own files.
# CC0-1.0 is notify's, a public domain dedication with nothing to keep or pass on.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "Unlicense", "ISC", "BSD-3-Clause", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A crate that is never published may name another of this workspace by path alone, as the
# bindings crates name pitboard-sites. pitboard-core, which is published, is named with its
# exact version, which a release raises.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
